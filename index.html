.chip::after{content:"";position:absolute;inset:-.1rem 0}

.tag.w1{background:rgba(52,199,89,.18);color:var(--green)}.tag.w2{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.tag.w3{background:rgba(255,149,0,.2);color:var(--orange)}.tag.w4{background:var(--fill)}
.tag.ok{background:rgba(52,199,89,.18);color:var(--green)}.tag.no{background:rgba(255,59,48,.16);color:var(--red)}.tag.verify{background:rgba(255,149,0,.2);color:var(--orange)}

ol.s>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:.7rem;width:1.8rem;height:1.8rem;border-radius:999px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:700;font-size:.9rem;display:grid;place-items:center}
ol.s .st{font-weight:600}ol.s .sd{color:var(--label2);font-size:.9375rem}
.note{background:rgba(255,149,0,.14);border-radius:1rem;padding:.8rem 1rem;margin:.6rem 0;font-size:.9375rem}

.btn{min-height:2.5rem;padding:.4rem 1rem;border-radius:999px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:600;font-size:.9375rem;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.8}.btn.sec{background:var(--fill);color:var(--acc)}
.btn.sm{min-height:2.25rem;padding:.25rem .8rem;font-size:.875rem}
.seg{display:flex;background:var(--fill);border-radius:.8rem;padding:.15rem;gap:.15rem;margin:.2rem 0 1rem}

.seg button[aria-pressed="true"]{background:var(--elev);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.box{width:1.5rem;height:1.5rem;border-radius:999px;border:2px solid var(--label3);flex:none;display:grid;place-items:center;margin-top:.1rem}
.check.on .box{background:var(--green);border-color:var(--green);color:#fff}.check.on .tx{color:var(--label2);text-decoration:line-through}
.box svg{width:.9rem;height:.9rem;opacity:0}.check.on .box svg{opacity:1}

.hero{border-radius:1.5rem;padding:1.2rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));margin:0 0 .9rem}

.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom)*0);width:min(calc(100% - 2rem),36rem);transform:translateX(-50%);
display:flex;height:3.5rem;padding:.25rem;border-radius:999px;background:var(--lg-tint);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 6px 20px var(--lg-sh);
transition:width .4s cubic-bezier(.3,1.25,.4,1),height .4s cubic-bezier(.3,1.25,.4,1)}

.tab svg{width:1.5rem;height:1.5rem;transition:width .3s,height .3s}

tually cook. Plan below.","research":{"sells":["Digital food products are the best fit: recipe book and a 7-day plan. Nothing to ship, high margin.","On TikTok Shop, food and beverage was reported as the fastest-growing category in 2026, but that is for physical food products, not for us."],"present":["Weekly menus (6.4% engagement) and budget meal prep (7.0%, few posts so far) beat single recipes, which are 48% of posts at about 5.0% and are crowded.","The best hooks in the 12-month TikTok data were a voiceover over b-roll (7.1%) and a bold claim (7.0%). Talking-head and slideshow hooks did less.","Food trends named for 2026: high-protein comfort bowls, cottage cheese in everything, air fryer recipes, café drinks at home (protein iced coffee, matcha), loaded savoury toasts, sweet and salty desserts.","Put macros and a grocery list on screen for weekly menus."],"how":["Comment-to-DM: end the reel with \"comment RECIPE and I send it\". The automation sends a link within seconds. This is the 2026 standard for creators who sell low-ticket guides.","Free first: the single recipe is free, the book (a week of menus) is the product."],"watch":["Do not promise weight loss results. Say \"example\", \"estimate\", and \"not medical advice\" for kcal and macros.","Cook every recipe for real before filming. The viewer can copy it, so it must work."],"src":[["Buzzabout: high-protein meal prep on TikTok (Oct 2026)","https://buzzabout.ai/trends/high-protein-meal-prep-tiktok"],["The Peach Kitchen: viral food trends 2026","https://www.thepeachkitchen.com/2026/03/10-viral-food-trends-you-need-to-try-in-2026-with-recipes/"],["CreatorFlow: Instagram funnel for fitness coaches","https://creatorflow.so/blog/instagram-funnel-fitness-coaches/"]]}},{"id":"code","name":"Coding and AI","icon":"code","color":["#0A84FF","#5E5CE6"],"genders":"A man","tagline":"Shows an AI app, prompt, workflow, skill or repo and runs it live.","what":"One man who teaches AI and coding hacks with Claude, tests tre ack","High: mini course"],"honesty":"Show real runs, including errors. No \"make 10k with AI\" or income claims. Credit open-source repos and licences. Only present code and apps the team actually ran.","kpis":["Watch time on Part 1","Part 1 to Part 2 return rate","Link clicks","Pack and course sales"],"tags":["#coding","#ai","#promptengineering","#buildinpublic","#aiinfluencer"],"desc":{"tt":"{h} Part 2 tomorrow. Prompt and template in my profile. {tags}","ig":"{h} I show the result first, then exactly how it works. Save this and follow for part 2. The pack is linked in my profile. (AI creator.) {tags}","yt_title":"{t}","yt":"In this Short: the idea, the prompt and the live result. Part 2 is next. The full course and templates are linked below. I am an AI creator. #Shorts {tags}"},"bio":"AI creator. I build with AI and show it working. Courses below.","research":{"sells":["Digital guides and prompt packs are the common product. The one rule in the sources: do not sell directly on TikTok. Offer a free resource first, collect an email, and sell the paid product from there."],"present":["Hook ingredients from a Claude Code workflow that studies top reels: fear of loss, curiosity, or identity (\"if you build apps, watch this\"). On-screen text of about 6 to 8 words. A new reveal every 3 to 5 seconds, with open loops.","Formats that work for educators: a 45 second micro-lesson with one action, a myth-buster, an over-the-shoulder audit (fix a real mistake on screen), a raw case study with real numbers, and replying to a comment with a video.","Post 3 to 5 videos a week when starting."],"how":["Link in bio goes to a free sign-up page (a prompt sheet or checklist), then an email sequence introduces the paid PDF.","Comment a keyword to get the free resource by DM."],"watch":["The author of the reel-study workflow says only 3 or 4 of 70 generated ideas were usable, and that top reels may win because of the creator's audience. Rewrite every hook in your own words and test."," Motion","The transition that makes an app feel premium"],["Series","Redesign a settings screen (Part 1)"],["Series","Part 2: the reveal with the animated transition"],["Offer","Inside the UI kit: five screens in 20 seconds"]],"hooks":["\"{c}\" Start on the before frame, then cut.","Contrarian: \"Your app does not need more features, it needs this.\"","Number: \"Three changes, one screen, completely different.\""],"offer":"A design course (with UI kits and palettes).","price":[9,149],"ladder":["Free: the tip or palette in the reel","Low: a template or palette pack","Mid: the design course"],"honesty":"Only show designs the team actually made. Do not pass off other people's work as yours, and do not recreate real brands' apps or logos.","kpis":["Replays and loops","Shares","Link clicks","Kit sales"],"tags":["#uidesign","#figma","#beforeandafter","#appdesign","#aiinfluencer"],"desc":{"tt":"{h} Watch the transition. Kit in my profile. {tags}","ig":"{h} Before and after, one screen. Save this for your next design. The full kit is linked in my profile. (AI creator.) {tags}","yt_title":"{t}","yt":"In this Short: the before, the after and the animated transition. The UI kit is linked below. I am an AI creator. #Shorts {tags}"},"bio":"AI creator. Before and after designs. UI kits below.","research":{"sells":["Designers in the sources monetise with free e-books and courses, templates, guides, and a paid or free Discord community. So the ladder is a free tip, a template or palette pack, then the course."],"present":["Trend notes from Figma for 2026: vibrant, saturated palettes and neon gradients are replacing muted ones, dark mode is standard, bold oversized type, micro-interactions, and high-contrast accessible palettes. Use these when you show a \"trendy\" palette.","Instagram carousels and reels with bite-sized tips, YouTube redesign critiques and tutorials, and short TikTok tips for junior designers.","Show the result on a real screen (a website or app), not a swatch alone ","Account created with AI label and bio","First 8 clips posted over 4 weeks (mix of formats)","Reviewed the numbers and the credits spent"],"ph":null,"weather":"For outdoor shots add a warm coat and scarf.","hair":"curly hair worn naturally","outfit":"a soft cardigan and jeans","setting":"in a small tidy living room corner with a shelf","plan":false,"bank":"home"},{"id":"no-lang","name":"Hedda","g":"w","mkt":"no","niche":"lang","age":31,"angle":"The everyday-conversation coach","wave":4,"price":"from kr95 to kr515 (about $9 to $49); rough starting range, not researched","learner":"English","bio":"AI language coach. One phrase per episode. Workbook below.","offer":"Phrase workbooks, flashcard decks, audio packs and mini courses.","backstory":"Hedda is a patient teacher who believes anyone can learn a few useful phrases in seconds. She speaks Norwegian natively, teaches one phrase per episode, repeats it slowly and then at natural speed, and keeps lessons short and warm.","voice":"31 years old, from Oslo, Oslo Norwegian (Bokmål) accent, medium pitch, patient, clear and smiling, slightly slower and articulate, relaxed conversational pace like talking to a friend, slightly casual and unpolished, not an announcer, not a sales voice.","photo":"Photorealistic candid phone photo of a 31-year-old woman who could plausibly be from Oslo, with long straight hair tucked behind one ear, wearing a smart-casual knit top and jeans, at a local café table with a notebook and a coffee. Natural skin texture with real imperfections, no beauty-filter gloss, slightly imperfect framing as if a friend took it, soft natural light. Full body, vertical 4:5, 4K.","sheet":"Three-panel character sheet of @Hedda in 16:9 on a plain 18% gray background. Far left: full-body front view of the outfit with the head completely out of frame, cut off at the neck. Middle: full-body rear view. Right: close-up of the face looking straight at the camera. Same person, same outfit (a smart-casual knit top and jeans), same hair (long straight hair tucked behind one ear), natural skin texture, soft even lighting, no props.","video":"@Hedda 12 seconds, vertical 9:16, 1080p, audio on. Hedda is at a local café table with a notebook and a coffee, wearing a smart-casual knit top and jeans, talking to the camera like telling a friend. Hook in the first second: Hello and goodbye. Second by second: 0 to 3 s the hook line and the key visual; 3 to 9 s the main point shown on screen; 9 to 12 s a calm closing line. Spoken in Norwegian as a native creator would say it, short and casual (ask Claude to write the exact line). Same face, hair and outfit for the whole clip. No music, no background voices, no subtitles, no on-screen text.","ask":"Use the ai-influencer-builder skill. Persona: Hedda (woman), niche Language learning, language Norwegian, city Oslo, angle: The everyday-conversation coach. For clip 1 (Hello and goodbye) write three native-language hooks, the spoken line, and the TikTok, Instagram Reels and YouTube Shorts descriptions in Norwegian. Ask me the phonetic spelling for any brand or foreign word before finalizing.","clips":[{"n":1,"kind":"Ep 1","title":"Hello and goodbye"},{"n":2,"kind":"Ep 2","title":"Please, thank you, sorry"},{"n":3,"kind":"Ep 3","title":"Yes, no, I do not understand"},{"n":4,"kind":"Ep 4","title":"Introduce yourself"},{"n":5,"kind":"Ep 5","title":"Numbers 1 to 10"},{"n":6,"kind":"Ep 6","title":"Order a coffee"},{"n":7,"kind":"Ep 7","title":"How much is it?"},{"n":8,"kind":"Ep 8","title":"Where is the station?"},{"n":9,"kind":"Ep 9","title":"Asking for help"},{"n":10,"kind":"Ep 10","title":"Season 1 recap and quiz"}],"hooks":["\"Hello and goodbye\" The phrase on screen in the first second.","Curiosity: \"The one word that makes locals smile.\"","Number: \"Ten seconds, one phrase, you can say it today.\""],"desc":{"tt":"Hello and goodbye. Episode 1. Follow for the next one. Workbook in profile. #learnlanguages #languagetips #speaklikeanative #dailylanguage #aiinfluencer","ig":"Hello and goodbye. Episode 1 of the series. Save it and say it out loud. The full workbook is linked in my profile. (AI creator.) #learnlanguages #languagetips #speaklikeanative #dailylanguage #aiinfluencer","yt_title":"Hello and goodbye","yt":"In this Short: one phrase, said slowly and then at natural speed, with the phonetic spelling. The workbook is linked below. I am an AI creator. #Shorts #learnlanguages #languagetips #speaklikeanative #dailylanguage #aiinfluencer"},"rules":[["AI label","Norwegian AI-labelling rules were not researched; label the persona as AI and check advertising rules."],["Niche rule","A native speaker must check every episode before it goes out. Give a phonetic spelling for each new word. Never teach wrong or invented phrases."],["Language check","Have a native Norwegian speaker watch three sample clips with the sound on before scaling. Dialect mismatch; test heavily."],["Voice quality","Nordic voice quality is untested. Launch last and test heavily."],["Pronunciation","Every episode is checked by a native speaker. Phonetic respellings on screen are approximate."]],"check":["Chose the face from the first photo","Named and saved the character in OpenArt","Voice designed and tested with a normal sentence","Character sheet added","Three photos in different outfits and places","Native speaker checked three sample clips","Account created with AI label and bio","First 8 clips posted over 4 weeks (mix of formats)","Reviewed the numbers and the credits spent"],"ph":{"hello":["Hei","(hy)"],"thanks":["Takk","(tahk)"],"station":["Hvor er stasjonen?","(voor air stah-SHOON-en)"],"caption":["Hi","Thank you"]},"weather":"For outdoor shots add a warm coat and scarf.","hair":"long straight hair tucked behind one ear","outfit":"a smart-casual knit top and jeans","setting":"at a local café table with a notebook and a coffee","plan":false,"bank":"lang"}],"plan":[{"id":"research","title":"Research: what works now","sub":"Algorithm, labels, what sells. Sources inside","icon":"bolt","blocks":[["p","Collected on 7 Nov 2026 from web sources. Many are vendor or agency blogs, so treat the numbers as signals to test, not facts. Each niche and each language page has its own research section with sources."],["h","What the platforms reward"],["list",["Instagram Reels (vendor analysis): saves rank above shares, then comments, then likes. Watch completion is the dominant signal, judged per follower. Design for strangers, because new-viewer reach is scored separately from follower reach.","The same source cites a 30 to 90 second sweet spot (median 30 to 60 s) and says reels under 15 seconds rarely trigger reach beyond followers. This is a vendor claim, but it matters: our clips are 12 seconds.","TikTok Shop guides: product videos of 15 to 30 seconds, reply to comments in the first hour, about 80% value and 20% selling, trending sounds."]],["h","AI labels"],["list",["Instagram: profiles featuring an AI-generated person need the \"AI-generated profile\" label since 31 Aug 2026, or they lose eligibility for recommendations. Using AI only for editing or captions does not need the label.","TikTok: realistic AI content needs a label, and TikTok also detects AI from metadata and watermarks. YouTube: realistic synthetic content must be disclosed, with an overlay label on Shorts since 27 May 2026.","Turn the labels on from day one. A disclosed AI persona should not lose reach for being artificial; an undisclosed one will."]],["h","How people sell"],["list",["Free resource first, then an email, then the paid product. Comment a keyword and get the free resource by DM.","Physical products: affiliate creators plus your own store; honest shipping times; test before you sell."]],["h","What this changes in our plan"],["list",["Clips are 12 seconds because of cost. The research favours 15 to 30 seconds for products and 30 to 60 for reach. Options: stitch two clips, or use voiceover over b-roll, which was the best-performing hook type for food.","Food: weekly menus and budget meal prep replace three single-recipe topics. Recipes stay, but they are no longer the whole plan.","Every reel ends with a comment-a-keyword line, so the free resource goes out by DM and the paid product follows by email.","Tyler cannot use a transformation story. His credibility comes from the maths, the recipes and the tools.","Gadgets and home depend on a registered company in the selling country and on TikTok Shop status, which is unclear in Portugal and absent in the Nordics."]],["src",[["Virlo: Instagram Reels algorithm 2026","https://virlo.ai/blog/instagram-reels-algorithm-2026-decoded"],["ContentGrip: Instagram AI-generated profile label","https://www.contentgrip.com/instagram-ai-profile-labels/"],["Billo: platform AI labeling in 2026","https://billo.app/blog/ai-labeling/"],["PortugalSEO: TikTok Shop Portugal guide","https://portugalseo.pt/tiktok-shop-portugal-guia-vender-plataforma/"],["CreatorFlow: Instagram funnel for fitness coaches","https://creatorflow.so/blog/instagram-funnel-fitness-coaches/"],["Learnybox: TikTok for course creators 2026","https://learnybox.com/en/blog/tiktok-for-course-creators/"]]]]},{"id":"waves","title":"Launch plan: pilot first","sub":"Two personas, four weeks, then decide","icon":"flag","blocks":[["p","A 12 s talking video costs about 3,850 credits, so this plan starts small. Run a pilot with two personas, learn what works and what it costs, and only then add more."],["cards",[["Pilot · weeks 1 to 4","Hannah (Healthy food, English US) and Ethan (Coding and AI, English US). Each posts about 2 clips a week: 1 talking video and 1 cheap format. Record views, follows, link clicks and credits spent per clip."],["Wave 1 · only if the pilot works","Tyler (weight loss food), Zoe (design) and the Portuguese Ines, Diogo and Catarina. Add 2 to 3 at a time, never all at once."],["Wave 2","Mason and Maya with their Shopify stores, Lily for language learning, and Rui, Joana and Sara in Portuguese. Open the store only after you have ordered and tested the first products."],["Wave 3","One betting persona only after a legal check in an allowed market, and only with real bets and real results."],["Wave 4","The remaining languages. Nordic ones last because voice quality is untested and they need native review."]]],["p","Every Pilot, Wave 1 and Wave 2 persona (13 in all) has a four-week plan on its own page, under Calendar, Topics and Setup: 12 connected topics, each with a teaser photo, a teaser story, the reel and a reel-is-live story that points to the product. The other personas get theirs when their wave starts."],["h","Move on when"],["list",["After about 8 clips a persona, you can see which hooks and formats get views, and what each clip cost in credits.","Keep a persona if people follow and click. Change the angle before you spend more on it.","Do not judge in 7 days: the 7-day challenge account that was written off later had a video pass 250,000 views."]],["h","Credits and cost"],["p","The full price list, plan comparison and monthly budgets are on the next page: Credits and cost."],["note","Later languages to consider (general knowledge, not researched): Swedish, Dutch, Polish, Hindi and Indian English, Indonesian, Turkish, Arabic."]]},{"id":"cost","title":"Credits and cost","sub":"What each piece costs, which plan, monthly budgets","icon":"bolt","blocks":[["p","Numbers come from the first tutorial (screens shown in Oct 2026) and the OpenArt plan page (6 Nov 2026). They change, so trust the Generate button on your own screen. Figures marked \"estimate\" are my arithmetic, not shown on screen."],["h","What each thing costs"],["cards",[["Talking video · 3,850 credits","Seedance 2.5, 9:16, 1080p, 12 seconds, audio on. The voice is made inside the video, so there is no separate voice fee per clip. A 15 s video is about 4,800 (estimate)."],["Photo · 245 credits","GPT Image 2.5, 4K, quality High. The character sheet is one such generation. Lower resolution or a lighter model should cost less; check the button."],["Character · no price shown","Creating and saving the character did not show a credit price. You are limited by the number of character slots in your plan."],["Voice · 250 credits, once","Designing a voice costs 1 credit per preview. Saving it costs 250 once, and it can be reused for other characters without paying again."],["Cheaper video settings","The model list shows Seedance 2.5 Draft at 480p (can be upgraded to 1080p within 7 days), 720p and 480p options, and Kling 4.0 marked 50% off. Their exact prices were not shown."]]],["h","Plans"],["cards",[["Starter · $14 a month ($13 annual)","4,000 credits: about 1 talking video a month. Commercial use rights are not listed on this plan, so skip it for a monetized account. 13 characters."],["Plus · $34 ($27 annual)","12,000 credits: about 3 talking videos a month. Commercial use rights. 40 characters. Credits can be added as needed."],["Pro · $56 ($44 annual)","24,000 credits: about 6 talking videos a month. 80 characters, 32 parallel generations. Kling 4.0 50% off and GPT Image 2.6 30% off."],["Wonder · $240 ($175 annual)","106,000 credits: about 27 talking videos a month. 353 characters, priority support, and \"Unlimited Creation\" (check which models it covers before counting on it)."]]],["h","Cost of one 12 s talking video (estimate)"],["list",["Starter: about $13.50 monthly, $12.50 annual.","Plus: about $10.90 monthly, $8.70 annual.","Pro: about $9.00 monthly, $7.10 annual.","Wonder: about $8.70 monthly, $6.40 annual.","Expect at least one retry per clip, so double these for real planning."]],["h","Budgets"],["cards",[["Setting up one persona","About 2,000 to 2,500 credits (estimate): character sheet, three photos with a few retries, and the 250 voice fee. Roughly $5 to $6 on Pro."],["Pilot: 2 personas, 4 weeks","Per persona per week: 1 talking video (3,850) and 1 cheap format (a photo with voiceover, about 250 to 750). About 17 talking videos and 17 cheap posts in the month would be about 65,000 credits without retries, or about 130,000 with them. Start with Wonder or Pro plus added credits, and cut to 1 talking video a week if the budget runs out."],["Wave 1: 5 more personas","At 3 talking videos a week each, one persona is about 50,000 credits a month (estimate). Five personas is about 250,000, or about 350,000 with the two pilot personas: more than three Wonder plans. At 2 talking videos a week, about 235,000 for all seven. Add personas only as the budget and the results allow."]]],["h","Ways to spend less"],["list",["Preview in Draft 480p and upgrade only the winners within 7 days.","Use 6 second clips when a short line is enough: cost grows with length (estimate).","Mix formats: a photo with a slow push-in and a voiceover costs a fraction of a talking video.","Use 1K or 2K photos for references and 4K only for the final.","Try Kling 4.0 on Pro or Wonder while it is 50% off.","Make one video and post it on TikTok, Instagram and YouTube Shorts with three different captions.","Set a credit cap per persona per week and write down what each clip cost."]],["h","Before you subscribe"],["steps",[["1. Read the real prices","In OpenArt, open each video and image setting you plan to use and note the number on the Generate button: 480p, 720p, 1080p, 6 s and 12 s, Draft, and Kling."],["2. Check the terms","Read the commercial-use terms and what Unlimited Creation includes."],["3. Start one month","Pick the smallest plan that covers the pilot, not the biggest. Switch only after you have measured real credits per clip."]]]]},{"id":"stages","title":"Build a persona, step by step","sub":"Stages 1 to 7 with prompts","icon":"steps","blocks":[["p","The same seven stages for every persona. Each persona page has its own filled-in prompts. Settings come from the tutorial (Oct 2026); if your screen differs, trust the screen."],["steps",[["1. Design the character and first photo","In OpenArt: Image, GPT Image 2.5 (Sunburst for quality, Flare for speed), Auto Polish off, 4:5, 4K, quality High. Paste the photo prompt. The result should look like a casual phone photo, not a studio shoot."],["2. Name","One word, no spaces, no accents, easy to type. It becomes the @Name tag."],["3. Voice and backstory","Design a voice (Clone needs a recording). Test it on an ordinary sentence in the persona's language. Backstory: 3 to 4 sentences, no looks, clothes or places, or the character gets locked to one outfit or location."],["4. Create the character","Character, Create character, Start from an image, add the photo and name, add the voice, paste the backstory, Create."],["5. Character sheet","Three panels on gray: headless front, rear, face close-up. Then Character, Browse library, gear icon, Add additional angles."],["6. Photo set","Character image with @Name; three everyday moments in different places and clearly different outfits. Describe the outfit in full every time."],["7. Videos","Character video: Seedance 2.5, 9:16, 1080p, 12 s (15 s for explainers), audio on. Add the matching photo as @image1 to keep place and outfit. Run the hook step and the phonetic step first."]]],["h","Common problems"],["list",["Saved outfit or tote bag returns: the prompt lacked a full outfit description.","A different person appears: character not saved, or @Name missing.","Face not recognised: add a character sheet with a clear face close-up.","Stuck in one outfit or place: the backstory mentioned clothes or places.","Video changes place or outfit: add the matching photo as a second reference.","Voice sounds like an ad: ask for casual, unpolished wording and test an ordinary sentence.","A brand is mispronounced: redo the phonetic step.","Speech sounds translated: rewrite natively and get a native speaker to check."]]]},{"id":"hooks","title":"Hooks and stop-scroll","sub":"The first 3 seconds of every video","icon":"hook","blocks":[["p","Based on common creator guides, not platform-confirmed rules. For every video Claude writes three hook variants in the persona's native register; you pick one. Viewers decide to swipe within about 3 seconds."],["h","Structure of each clip (15 to 45 seconds)"],["steps",[["Hook · 0 to 3 s","One sentence or image that makes the next second necessary."],["Bridge · 3 to 8 s","Promise what is coming and why it matters, without giving it away."],["Payoff","The recipe, build, redesign, test or lesson. Show the result."],["Soft close and loop","One low-pressure line; cut the end so it flows back into the first frame."]]],["h","Hook types to rotate"],["cards",[["Curiosity gap","State the result, hide the method."],["Contrarian","Challenge a common belief."],["Specific number","\"Four ingredients, nine minutes, 410 kcal.\""],["Mistake or warning","Name a costly error."],["Before and after","Show the end state first."],["Direct call-out","\"If you can't cook, watch this.\""],["Open loop","Start mid-story."],["Pattern interrupt","Sudden close-up or sound change."]]],["h","Stop-scroll techniques (use at least two)"],["list",["Visual: open on motion or a striking close-up; no logo, no slow fade-in, no \"hi guys\"; the result in the first second; eye contact.","Text: large, bold, high-contrast hook text in frame one, in the persona's language, inside the safe area; burned-in captions for the whole clip.","Audio: spoken hook in the first second, a sound change near 3 s, a trending sound where supported.","Pacing: a cut, zoom or new angle every 2 to 4 seconds; no dead air."]],["h","Measure"],["list",["Share still watching at 3 seconds","Average watch time as a percent of length","Saves, shares and link clicks"]],["note","If viewers leave before 3 seconds, change the hook, not the video. Test three hook variants. Never use a hook translated from English: write it as a native creator would say it."]]},{"id":"sell","title":"Selling without selling","sub":"Create desire without sounding like an ad","icon":"tag","blocks":[["p","Each video gives something useful first. The offer appears as the natural next step. The viewer should want the next thing, not be told to buy."],["h","Rotate three post types"],["cards",[["Value-first · about 60%","Useful tip, recipe, build, lesson or result. No offer, or only \"more in my profile\"."],["Story · about 25%","A problem and how it was solved, with the product inside the story."],["Soft call to action · about 15%","The product in use plus one calm line."]]],["note","The 60/25/15 split is a starting suggestion; the sources give no fixed ratio. Test it."],["h","Techniques"],["list",["Show, don't pitch: demonstrate the plan, app or before and after in use.","Normalize the mention: the offer is part of the routine.","Create the need first: make the viewer's problem vivid, then show the way out.","Answer the unspoken doubt: \"does it work for a beginner?\"","Open loops across a series: end Part 1 with the question Part 2 answers.","Real proof only: real screenshots, real results, honest limits."]],["h","Soft call-to-action lines"],["list",["\"The full plan is in my bio if you want it, no pressure.\"","\"I put the whole thing in one file, link's in my profile.\"","\"Part 2 tomorrow.\""]],["note","Avoid \"Limited time only!\" and \"Don't miss out!\" Disclose affiliate or paid content in the video and the description."]]},{"id":"desc","title":"Descriptions per platform","sub":"TikTok, Instagram Reels, YouTube Shorts","icon":"text","blocks":[["p","Claude writes all three for every video, three versions each, in the persona's language. Each persona page has an English draft for clip 1 and a ready-to-copy request for Claude."],["cards",[["TikTok","Best length 15 to 60 s. First line: the hook plus the main keyword. 1 to 3 short lines and a question to trigger comments. 4 to 7 hashtags: 3 to 5 trending and relevant plus 1 or 2 niche. Use TikTok's AI-generated content label and \"AI creator\" in the profile."],["Instagram Reels","Best length 15 to 90 s. The hook goes before the \"more\" cut. 2 to 4 short lines with line breaks; a story or a save-worthy list. 5 to 10 niche hashtags at the end or in the first comment. Use the AI label setting and the Paid partnership label when it applies."],["YouTube Shorts","Under 60 s (up to 3 min). Searchable title with the main keyword; no hashtags in the title. Description 100 to 300 words, keywords used naturally, chapters if over 60 s. 3 to 5 hashtags including #Shorts. Turn on the altered or synthetic content disclosure; mention affiliate links."]]],["h","Rhythm and file"],["list",["From one guide (verify): TikTok and Reels 5 to 7 per week, Shorts 1 to 2 per day.","Upload the original full-resolution file, not a screen recording.","Keep key elements centred; Reels crop to 4:5 in the feed."]],["h","Worked example · Healthy food, English (US)"],["prompt","TikTok","Seven dinners under 450 kcal and I only shopped once. Which day would you cook first? Part 2 tomorrow. Plan is in my profile. #mealprep #healthyrecipes #caloriedeficit #easydinner #aiinfluencer"],["prompt","Instagram","Dinner used to be my biggest calorie trap. So I planned the whole week in one shop: seven meals, every one under 450 kcal. Save this for your next grocery run. The full plan is linked in my profile. (I'm an AI creator.) #mealprep #healthyrecipes #easydinners #caloriedeficit"],["prompt","YouTube Shorts title and description","7 dinners under 450 kcal (one grocery trip)\n\nSeven simple dinners, each under 450 kcal, from one grocery trip. In this Short: the shopping list, the portions and the swap that cut the most calories. The complete printable week plan is linked below. I'm an AI creator; the link is a product link where stated. #Shorts #mealprep #healthyrecipes #caloriedeficit"]]},{"id":"nat","title":"Naturality standard","sub":"Looks, movement, speech","icon":"eye","blocks":[["p","Spotless means the same believable face every time, motion a viewer does not question, and speech a native speaker accepts as their own. Run this on every clip."],["h","Look"],["list",["Real imperfections (skin texture, freckles, flyaway hair), no beauty-filter gloss, Auto Polish off.","Phone-camera feel: candid framing, slight tilt, natural noise.","Local details that match the market: language on signs, plugs, cars, clothes for the weather, plausible local cafes and kitchens.","A full outfit description in every prompt."]],["h","Movement"],["list",["Clips of 12 seconds or less, one action each, handheld or selfie style, at most one camera move.","Ask for the action second by second.","Check hands and fingers, blinking, eye line, teeth, jewellery flicker, background text, extra people, outfit continuity and audio glitches. Regenerate rather than fix."]],["h","Speech"],["list",["One or two short sentences per 12-second clip, written the way people talk, not the way ads read.","Use the filler words and rhythm of the language, and have a native speaker confirm them.","Use the register a creator would use on camera, not textbook speech."]],["note","Before scaling any persona: make three sample clips, have a native speaker watch them with the sound on, save the persona bible, and re-check the pronunciation of every brand and foreign name. The tutorial only showed English; native voice quality in other languages is untested."]]},{"id":"brand","title":"Brands and phonetic spelling","sub":"Always ask before writing the final line","icon":"mic","blocks":[["p","Voice models mispronounce brand names, app names, acronyms and foreign words. Whenever a script names one, Claude stops and asks you how it should sound."],["steps",[["List every risky word","Brands, product and app names, people's names, acronyms, URLs, prices and numbers."],["Ask one question per word","\"How should [brand] sound when [persona] says it in [language]?\" Claude may suggest a spelling; you confirm it, because only a native speaker knows the local sound."],["Write the line with the confirmed spelling","Keep the correct spelling in the on-screen text or caption."],["Listen and fix","Report any word that still sounds wrong; regenerate only that clip."],["Keep a glossary per persona","Reuse it in later scripts."]]],["list",["Write numbers and prices out in words in the spoken line.","Do not read web addresses aloud: say \"link in bio\" and show it on screen.","Show a real product only when the team bought and filmed it; otherwise plain unbranded props.","In language-learning episodes, give each new word a phonetic spelling too."]]]},{"id":"rules","title":"Rules and risks","sub":"Checked 5 Nov 2026 · not legal advice","icon":"shield","blocks":[["note","These come from web sources, not lawyers. Verify locally before launch."],["h","AI labelling and sponsored content"],["cards",[["United States","FTC endorsement guides cover virtual influencers. Paid or affiliate links need a clear disclosure, and the source advises also saying the influencer is virtual, inside the video."],["European Union","AI Act Article 50 applies from 2 August 2026. Tool providers must mark AI output in machine-readable form; people making deepfakes must disclose it. Tools already on the market get until 2 December 2026 for the marking duty. Whether a fully invented person counts as a deepfake was not settled in the source, so label anyway."],["France","France: the 2023 influencer law requires \"Publicité\" or \"Collaboration commerciale\" on sponsored posts and \"Image virtuelle\" on AI-generated posts. Influencers and advertisers share liability, and influencers answer for dropshipped products."],["UK, Norway, Brazil, Latin America","Not researched. Label the persona as AI and check the local advertising rules."]]],["h","Sports betting promotion by market"],["cards",[["English (US)","US betting promotion is state by state and was not verified. Check each state and get legal advice before any betting persona. Show 21+ and a responsible-gambling message."],["English (UK)","UK: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Spanish (Latin America)","Latin American betting promotion varies by country and was not verified. Pick one country and check its regulator before any betting persona."],["Portuguese (Brazil)","Brazil regulates betting and its advertising, but this was not verified here. Check the current rules with a lawyer before any betting persona."],["Portuguese (Portugal)","Portuguese betting promotion rules were not verified. Check the regulator (SRIJ) and get legal advice before any betting persona."],["French","France: since the law of 9 June 2023 influencers may not promote paid sports-tip subscriptions, and tip services cannot be presented as improving the chance of winning. No betting persona in France."],["Italian","Italy: near-total ban; influencer ads and affiliate marketing for betting are prohibited. No betting persona in Italy."],["German","Germany: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Finnish","Finland: state gambling monopoly; promoting other operators is illegal marketing, and a new law from 1 July 2027 effectively bans influencers from distributing even licensed operators' marketing. No betting persona."],["Danish","Denmark: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Norwegian","Norway: promotion is limited to the two monopoly operators; helping market sites licensed elsewhere is illegal. No betting persona."]]],["h","Content rules wherever betting is used"],["list",["Real account, real bets, real outcomes including losses.","No claims that tips improve the chance of winning or guarantee profit.","Show the age limit and a responsible-gambling message.","Check the app and its promotion are legal in that market.","Disclose the affiliate link and that the persona is AI."]],["h","Other"],["list",["Healthy food: kcal and portions as information, no extreme diets or medical promises.","Never base a persona on a real person's face or voice.","Check OpenArt's terms on commercial use of outputs and saved characters.","Check tax or business registration where you live."]]]},{"id":"teaser","title":"Adult-adjacent persona (women only)","sub":"What is possible and what is not","icon":"lock","blocks":[["p","You asked for a women-only persona with more natural, more erotic videos to send visitors to a subscription page. I can help build a suggestive-but-not-explicit teaser persona. I will not write or plan explicit sexual content."],["h","Where the subscription page can live"],["cards",[["OnlyFans","One third-party source (checked 5 Nov 2026) reports that the October 2026 Terms require AI content to clearly feature the verified creator and prohibit wholly AI-generated accounts. A fully invented persona is likely not allowed. Verify with OnlyFans' own terms or support."],["Fanvue","Its help page says fully AI virtual characters are allowed if you pass ID verification, label the account clearly as AI, never tell fans she is real, and the character looks clearly adult. It must not resemble a real identifiable person without documented consent. Verify the current wording."]]],["h","Where teasers can be posted"],["list",["TikTok bans content promoting sexual solicitation, including premium sexual content. A 2021 report said linking an OnlyFans from a profile got accounts banned; policies may have changed.","Instagram and YouTube restrict sexually suggestive content, nudity and adult-service promotion.","On those three platforms the persona stays lifestyle-level and does not mention, link or hint at an adult page where the rules forbid it.","No coded wording, hidden links or other ways around moderation."]],["h","The persona"],["list",["Clearly an adult woman (25 or older in appearance), an invented face, no real person's likeness.","Warm, confident, flirty personality; everyday settings; natural movement and speech.","Clearly labelled as AI in the bio and with each platform's AI label.","Suggestive means styling, framing and personality at roughly PG-13 level."]],["h","Keep out"],["list",["Anything that could read as a minor.","Deepfakes or content from other people's photos.","Claims she is a real woman, or fake private messages.","Explicit content: I will not write it, and image tools usually restrict it."]],["note","Launch after Wave 1, once lifestyle content shows an audience, and only after reading the current rules of the subscription site and each posting platform."]]},{"id":"caveats","title":"Honest expectations","sub":"What the tutorials really showed","icon":"scale","blocks":[["list",["The only real-money result: 23 workbook sales at $12 = $276 revenue, minus $19.52 payment fees and a $99 tool plan = $157.48 profit in a week, short of the author's $1,000 goal.","Both tutorials carry affiliate links and one is sponsored. Results shown are curated; real work includes retries and wasted credits.","Label every account as AI. Do not present generated people, testimonials or sponsored content as a real person's genuine experience.","Not covered by the tutorials: OpenArt's commercial terms, each platform's current rules for AI accounts, and tax rules."]],["h","Strategy from the 7-day challenge"],["list",["Research first: study existing AI accounts and how they earn.","Make the character distinctive, not generic.","Test several accounts, about 10 videos each, and compare.","Ways to earn: brand deals (slow), physical products, affiliate (quick), digital products (a structured workbook sold for $12 and linked from the bio).","Use the persona to gain attention, then put one offer in front of that audience through the bio link."]]]},{"id":"week","title":"First-week plan","sub":"Five steps to start","icon":"calendar","blocks":[["steps",[["1. Check credits and terms","Read the Credits and cost page, check the Generate prices on your screen, and pick a pilot persona and a distinctive character concept."],["2. Build the character","Stages 1 to 5. Save the persona bible."],["3. Make content","Three photos, one talking video from a photo, one selfie video. Run the hook step, the naturality checklist and the phonetic step. Write the three platform descriptions."],["4. Create the account","AI label and a clear bio. Post 2 to 4 clips over the week, with captions, mixing one talking video and cheaper formats."],["5. Review","After a week, note which hooks and video types got views. Only then choose how the persona earns."]]]]}],"epis":[["Season 1: Basics",["Hello and goodbye","Please, thank you, sorry","Yes, no, I do not understand","Introduce yourself","Numbers 1 to 10","Order a coffee","How much is it?","Where is the station?","Asking for help","Recap and quiz"]],["Season 2: Eating and shopping",["Menu words","Allergies and preferences","Order dinner","Pay the bill","At the market","Sizes and colours","Asking for a discount","Complimenting the food","Small talk about the weather","Recap and quiz"]],["Season 3: Getting around",["Train tickets","Taxi and ride-hailing","Directions","Hotel check-in","Time and dates","Emergencies","Making plans","Texting slang","A mini conversation","Finale quiz"]]],"bank":{"food":{"topics":[{"t":"Blueberry cake without the sugar crash","prob":"Most people want something sweet that does not wreck their day.","tech":"Show the finished result first","ph":"A whole blueberry cake on a plate, one slice cut out, steam visible, kitchen blurred behind.","cap":{"en":"This is the cake I make when I want dessert and no guilt. Tomorrow I show you how.","pt":"Este é o bolo que faço quando quero sobremesa sem culpa. Amanhã mostro como se faz."},"q":{"en":"Guess the secret ingredient?  Greek yogurt / Banana / Oats","pt":"Adivinhas o ingrediente secreto?  Iogurte grego / Banana / Aveia"},"b":[["Close-up of a slice being lifted, blueberries bursting. On screen: \"Blueberry cake, no refined sugar\".",{"en":"This blueberry cake has no refined sugar, and you will not taste the difference.","pt":"Este bolo de mirtilos não leva açúcar refinado e nem dás por isso."}],["Hands mix oats, Greek yogurt, egg, ripe banana and blueberries in one bowl; each ingredient appears as text. Pour into the tin.",{"en":"One bowl. Oats, Greek yogurt, a ripe banana, an egg and blueberries. Mix, pour, bake.","pt":"Uma taça. Aveia, iogurte grego, uma banana madura, um ovo e mirtilos. Mistura, deita, vai ao forno."}],["Cut slice on a plate, {name} takes a bite and nods at the camera.",{"en":"Thirty minutes, and it is done. The full recipe is in my recipe book, link in bio.","pt":"Trinta minutos e está pronto. A receita completa está no meu livro de receitas, link na bio."}]],"ot":{"en":"Blueberry cake · no refined sugar","pt":"Bolo de mirtilos · sem açúcar refinado"},"te":"One bowl, five ingredients, a ripe banana as the sweetener. Show the ingredients as text so the viewer can copy them.","cta":{"en":"The full recipe is in my recipe book, link in bio.","pt":"A receita completa está no meu livro de receitas, link na bio."}},{"t":"Healthy apple pie that still tastes like pie","prob":"People think healthy pie means dry and boring.","tech":"Contrast a common belief","ph":"A golden apple pie in a dish with one slice cut, cinnamon on the side, on a wooden table.","cap":{"en":"The apple pie I made today. Recipe is in my recipe book, link in bio.","pt":"A tarte de maçã que fiz hoje. A receita está no meu livro de receitas, link na bio."},"q":{"en":"Pie for dessert or breakfast?  Dessert / Breakfast","pt":"Tarte para sobremesa ou pequeno-almoço?  Sobremesa / Pequeno-almoço"},"b":[["Slice lifted with a spatula, filling visible. Text: \"Healthy does not mean dry\".",{"en":"Healthy pie does not have to be dry. Watch this.","pt":"Tarte saudável não tem de ser seca. Vê isto."}],["Hands slice apples, toss with cinnamon, press an oat and almond base into the dish, add the topping.",{"en":"Sliced apples, cinnamon, an oat and almond crust, and a little honey. No butter, no white flour.","pt":"Maçãs às fatias, canela, uma base de aveia e amêndoa e um pouco de mel. Sem manteiga, sem farinha branca."}],["Pie out of the oven, {name} cuts a slice and holds it to the camera.",{"en":"Warm, crisp on top, soft inside. The recipe is in my recipe book, link in bio.","pt":"Quente, estaladiça por cima, macia por dentro. A receita está no meu livro de receitas, link na bio."}]],"ot":{"en":"Apple pie · oats and almonds","pt":"Tarte de maçã · aveia e amêndoa"},"te":"Replace the white flour and butter with oats, almonds and a little honey. One bake, three real steps.","cta":{"en":"The full recipe is in my recipe book, link in bio.","pt":"A receita completa está no meu livro de receitas, link na bio."}},{"t":"Healthy cheeseburger","prob":"People crave fast food and then feel bad.","tech":"Common craving","ph":"A stacked burger cut in half on a board, cheese melting, fries made of sweet potato beside it.","cap":{"en":"Tomorrow: the cheeseburger that fits your week.","pt":"Amanhã: o hambúrguer que cabe na tua semana."},"q":{"en":"Would you try it?  Yes / Only with cheese","pt":"Experimavas?  Sim / Só com queijo"},"b":[["Burger cut in half, cheese stretching. Text: \"Fast food craving, fixed\".",{"en":"Craving a cheeseburger? Make this one instead.","pt":"Com vontade de um hambúrguer? Faz este."}],["Hands shape lean beef or turkey patties, sear them, add cheese, stack on a whole grain bun with lettuce and tomato.",{"en":"Lean beef, a slice of real cheese, a whole grain bun, lots of lettuce and tomato.","pt":"Carne magra, uma fatia de queijo a sério, pão integral, muita alface e tomate."}],["{name} takes a bite and smiles.",{"en":"Same craving, far less regret. The recipe is in my recipe book, link in bio.","pt":"A mesma vontade, muito menos arrependimento. A receita está no meu livro de receitas, link na bio."}]],"ot":{"en":"Healthy cheeseburger","pt":"Hambúrguer saudável"},"te":   var lines=[];D.personas.forEach(function(p){var s=pStatus(p.id),n=S.nt[p.id],ck=(S.ck[p.id]||[]).length;if(s!=='review'||n||ck)lines.push(p.name+' ('+NK[p.niche].name+', '+MK[p.mkt].name+', '+gtxt(p.g)+'): '+stText(s)+', checklist '+ck+'/'+p.check.length+(n?'. Notes: '+n:''))});
  copy(lines.length?lines.join('\n'):'No review notes yet.');
 }
});

 if(e.target.id==='q'){nav.q=e.target.value;refreshList()}
 else if(e.target.id==='nt'){S.nt[e.target.dataset.id]=e.target.value;save()}
});

var lastY=0,ticking=false;
addEventListener('scroll',function(){
 if(ticking)return;ticking=true;
 requestAnimationFrame(function(){
  ticking=false;var y=scrollY;
  top.classList.toggle('sc',y>50);navbg.classList.toggle('sc',y>8);
  if(y>lastY+8&&y>12)tabbar.classList.add('min');else if(y<lastY-8||y<=12)tabbar.classList.remove('min');
  lastY=y;
 });
},{passive:true});
var saved={};
function restore(){}
addEventListener('popstate',function(){});
matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);


/* ---------- swipe back from the left edge ---------- */
var sw={on:false,lock:false,x0:0,y0:0,dx:0,t0:0,view:null,prev:null,inner:null,dim:null};
function prevCtx(){var i=nav.stack.length-2;return i>=0?nav.stack[i]:{v:nav.tab}}
function swStart(){
 sw.view=root.querySelector('.view');if(!sw.view)return false;
 var c=prevCtx(),store=copyStore,html=viewHtml(c);copyStore=store;
 var pushed=nav.stack.length-1>0;
 sw.prev=document.createElement('div');sw.prev.className='pg-prev';sw.prev.setAttribute('aria-hidden','true');
 var y=scrolls.length?scrolls[scrolls.length-1]:0;
 sw.prev.innerHTML='<div class="view'+(pushed?' pushed':'')+'" style="transform:translateY('+(-y)+'px) translateX(-28%);transition:none">'+html+'</div><div class="dim"></div>';
 sw.inner=sw.prev.firstChild;sw.dim=sw.prev.lastChild;
 sw.prev.querySelectorAll('[id]').forEach(function(e){e.removeAttribute('id')});
 document.body.appendChild(sw.prev);
 sw.view.classList.add('sw');sw.view.style.transition='none';
 return true;
}
function swApply(dx){
 var W=innerWidth,p=Math.min(1,dx/W);
 sw.view.style.transform='translateX('+dx+'px)';
 var y=scrolls.length?scrolls[scrolls.length-1]:0;
 sw.inner.style.transform='translateY('+(-y)+'px) translateX('+(-28*(1-p))+'%)';
 sw.dim.style.opacity=(.22*(1-p)).toFixed(3);
}
function swClean(){if(sw.prev){sw.prev.remove()}if(sw.view){sw.view.classList.remove('sw');sw.view.style.transform='';sw.view.style.transition=''}sw.prev=sw.view=sw.inner=sw.dim=null;sw.on=false;sw.lock=false}
function swEnd(commit){
 var W=innerWidth,v=sw.view,inner=sw.inner,dim=sw.dim;animUntil=Date.now()+360;
 var ease='transform .32s cubic-bezier(.32,.72,0,1)';
 v.style.transition=ease;inner.style.transition=ease;dim.style.transition='opacity .32s';
 var y=scrolls.length?scrolls[scrolls.length-1]:0;
 if(commit){
  v.style.transform='translateX('+W+'px)';inner.style.transform='translateY('+(-y)+'px) translateX(0)';dim.style.opacity=0;
  setTimeout(function(){var by=scrolls.pop()||0;nav.stack.pop();nav.sec='Overview';var prev=sw.prev;sw.prev=null;renderView();scrollTo(0,by);if(prev)prev.remove();sw.view=null;swClean()},330);
 }else{
  v.style.transform='translateX(0)';inner.style.transform='translateY('+(-y)+'px) translateX(-28%)';dim.style.opacity=.22;
  setTimeout(swClean,330);
 }
}
document.addEventListener('touchstart',function(e){
 if(nav.stack.length===0||sheetEl||e.touches.length!==1||Date.now()<animUntil||sw.prev)return;
 var t=e.touches[0];if(t.clientX>30)return;
 sw.on=true;sw.lock=false;sw.x0=t.clientX;sw.y0=t.clientY;sw.dx=0;sw.t0=Date.now();
},{passive:true});
document.addEventListener('touchmove',function(e){
 if(!sw.on)return;var t=e.touches[0],dx=t.clientX-sw.x0,dy=t.clientY-sw.y0;
 if(!sw.lock){
  if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
  if(Math.abs(dy)>Math.abs(dx)||dx<0){sw.on=false;return}
  if(!swStart()){sw.on=false;return}
  sw.lock=true;
 }
 e.preventDefault();sw.dx=Math.max(0,dx);swApply(sw.dx);
},{passive:false});
function swFinish(){
 if(!sw.on)return;if(!sw.lock){sw.on=false;return}
 sw.on=false;var dt=Math.max(1,Date.now()-sw.t0),v=sw.dx/dt;
 swEnd(sw.dx>innerWidth*.33||v>.5);
}
document.addEventListener('touchend',swFinish);
document.addEventListener('touchcancel',function(){if(sw.on&&sw.lock){sw.on=false;swEnd(false)}else sw.on=false});

/* ---------- boot ---------- */
applyTheme();renderTab();renderView();
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
