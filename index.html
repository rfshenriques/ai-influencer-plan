"Cables everywhere, then ten minutes. Label them, clip them, bundle them, hide the box. It costs under fifteen dollars and I look at it every day. Worth it.","pt":"Cabos por todo o lado, depois dez minutos. Etiqueta, prende, junta, esconde a caixa. Custa menos de quinze euros e olho para isto todos os dias. Vale a pena."},"te":"A visible, cheap improvement.","se":null,"g":"m"}],"photos":[{"t":"Profile photo: the face","img":"Close portrait, warm room light, plants and shelves blurred behind. Warm smile. 4:5.","why":"The account face.","cap":{"en":"Hi, I am {name}. AI creator. Home finds we bought and tested.","pt":"Olá, sou {a} {name}. Criad{ora} de IA. Achados para casa que comprámos e testámos."}},{"t":"Home flat lay","img":"Top-down: three small home items on a table with a plant. 4:5.","why":"The format in one picture.","cap":{"en":"This week's home finds.","pt":"Os achados de casa desta semana."}},{"t":"Room corner","img":"{name} sits in a cosy corner with a mug, soft evening light. 4:5.","why":"Warmth and taste.","cap":{"en":"My favourite corner. It cost very little.","pt":"O meu canto preferido. Custou muito pouco."}},{"t":"Carousel: before and after","img":"Three slides: before, after, what changed. Clean white background. 4:5.","why":"Saved and shared a lot.","cap":{"en":"Swipe for the before and after.","pt":"Desliza para o antes e depois."}},{"t":"Out in {city}","img":"{name} at a home store in {city} holding a basket, casual. 4:5.","why":"Real-life hunting.","cap":{"en":"On the hunt. Basket full, wallet fine.","pt":"À caça. Cesto cheio, carteira bem."}},{"t":"Behind the scenes","img":"Cardboard boxes, tape, scissors everywhere, {name} laughing. 4:5.","why":"Warmth and trust.","cap":{"en":"Test week. We live in a box fort.","pt":"Semana de testes. Vivemos num forte de caixas."}}],"stories":[{"t":"Meet {name}","fr":["Selfie at home with \"Hi, I am {name}\"","Quick room tour","Text: \"AI creator, we test home finds\""],"st":"Link sticker","go":"Introduce the face and the AI label."},{"t":"Poll: keep or return?","fr":["Photo of an item","Poll sticker Keep or Return","Result frame"],"st":"Poll","go":"Let the audience guess.","q":{"en":["Keep or return?"],"pt":["Fica ou devolve?"]}},{"t":"Room challenge","fr":["Photo of a messy spot","Question box: \"Show me yours\"","Answer frames"],"st":"Question box","go":"Invite replies."},{"t":"Quiz: how much did this cost?","fr":["Photo of an item","Quiz sticker with three prices","Answer frame"],"st":"Quiz","go":"Interaction and learning.","q":{"en":["How much did this cost?"],"pt":["Quanto custou isto?"]}},{"t":"Test in progress","fr":["Setup photo","Mid-test close-up","Result teaser"],"st":"Emoji slider: \"Will it work?\"","go":"Show testing as it happens."},{"t":"Reel reminder","fr":["Thumbnail of the new reel with arrow","One line why to watch","Link sticker"],"st":"Link sticker","go":"Drive views to the newest reel."},{"t":"Q and A","fr":["Answers to three questions","Answer with a short clip","Answer with a photo"],"st":"Question box","go":"Answer and build trust."},{"t":"Guide teaser","fr":["Screenshot of the guide","One highlighted checklist","\"Guide in my bio\""],"st":"Link sticker","go":"Soft offer once trust exists."}]},"lang":{"reels":[{"t":"Episode 1: Hello and goodbye","k":"Lesson, slow then natural","tech":"Challenge the viewer","h":{"en":"Say \"hello\" like a native in five seconds.","pt":"Diz \"olá\" como um português em cinco segundos."},"sh":{"en":["0-3s: {name} at a café table, waves, the key word large on screen.","3-8s: Slow: \"hello\". Then natural speed. Then \"goodbye\" and \"bye\".","8-12s: {name} points at the viewer: your turn."],"pt":["0-3s: {name} numa mesa de pastelaria, acena, a palavra principal em grande no ecrã.","3-8s: Devagar: \"olá\". Depois velocidade normal. Depois \"adeus\" e \"tchau\".","8-12s: {name} aponta para quem vê: a tua vez."]},"ot":{"en":["Hello = Hola (jelóu)","Goodbye = Adiós (gudbái)","Bye = Chao (bái)"],"pt":["Olá = Hello (oh-LAH)","Adeus = Goodbye (ah-DEH-oosh)","Tchau = Bye (chow)"]},"s":{"en":"Hello. Slowly: hello. Normal speed: hello. Now goodbye. And the short one, bye. Say them out loud with me. Episode two tomorrow.","pt":"Olá. Devagar: olá. Velocidade normal: olá. Agora adeus. E o curto, tchau. Diz em voz alta comigo. Episódio dois amanhã."},"te":{"en":"One phrase pair, slow then natural, with the sound written out. Spanish captions on screen.","pt":"Um par de frases, devagar e depois natural, com o som escrito. Legendas em inglês no ecrã."},"se":{"en":"The workbook with every episode is in my bio.","pt":"O caderno com todos os episódios está na bio."}},{"t":"Episode 2: Please, thank you, sorry","k":"Lesson with a mini scene","tech":"Relatable mistake","h":{"en":"Three words that make people like you instantly.","pt":"Três palavras que fazem as pessoas gostar de ti logo."},"sh":{"en":["0-3s: {name} hands over a coffee, \"please\".","3-9s: Three cards: please, thank you, sorry, each said slow then natural.","9-12s: A small smile and a nod."],"pt":["0-3s: {name} entrega um café, \"por favor\".","3-9s: Três cartões: por favor, obrigada/o, desculpa, ditos devagar e depois natural.","9-12s: Um sorriso pequeno e um aceno."]},"ot":{"en":["Please = Por favor (plís)","Thank you = Gracias (zánk iu)","Sorry = Lo siento (sóri)"],"pt":["Por favor = Please (poor fah-VOR)","Obrigado/a = Thank you (oh-bree-GAH-doo/-dah)","Desculpa = Sorry (dish-KOOL-pah)"]},"s":{"en":"Please. Thank you. Sorry. Three words, and every door opens. Please. Slowly: please. Thank you. Sorry. Which one do you forget the most? Tell me below.","pt":"Por favor. Obrigada. Desculpa. Três palavras, e todas as portas se abrem. Por favor. Devagar: por favor. Obrigada. Desculpa. Qual te esqueces mais? Diz-me abaixo."},"te":{"en":"Politeness words in the real order you need them.","pt":"As palavras de cortesia pela ordem em que as vais precisar."},"se":null},{"t":"Episode 3: Yes, no, I do not understand","k":"Lesson","tech":"Survival phrase","h":{"en":"The most useful sentence in any language.","pt":"A frase mais útil em qualquer língua."},"sh":{"en":["0-3s: {name} confused, hands up.","3-9s: Cards: yes, no, I do not understand. Slow then natural.","9-12s: {name} laughs and points at the screen."],"pt":["0-3s: {name} confusa(o), mãos no ar.","3-9s: Cartões: sim, não, não percebo. Devagar e depois natural.","9-12s: {name} ri-se e aponta para o ecrã."]},"ot":{"en":["Yes = Sí (yes)","No = No (nóu)","I do not understand = No entiendo (ai dóunt anderstánd)"],"pt":["Sim = Yes (seeng)","Não = No (nowng)","Não percebo = I do not understand (nowng per-SEH-boo)"]},"s":{"en":"Yes. No. And the survival sentence: I do not understand. Slowly: I do not understand. Use it, and people slow down for you. It is the most useful one.","pt":"Sim. Não. E a frase de sobrevivência: não percebo. Devagar: não percebo. Usa-a, e as pessoas falam mais devagar contigo. É a mais útil."},"te":{"en":"The phrase that makes any conversation easier.","pt":"A frase que facilita qualquer conversa."},"se":null},{"t":"Episode 4: Introduce yourself","k":"Lesson with a mini scene","tech":"Practical promise","h":{"en":"Introduce yourself in ten seconds. No stress.","pt":"Apresenta-te em dez segundos. Sem stress."},"sh":{"en":["0-3s: {name} gives a small wave, name tag on screen.","3-9s: Three lines built up: name, where from, nice to meet you.","9-12s: Handshake toward camera."],"pt":["0-3s: {name} acena, cartão com nome no ecrã.","3-9s: Três frases construídas: nome, de onde és, prazer em conhecer-te.","9-12s: Aperto de mão para a câmara."]},"ot":{"en":["My name is... = Me llamo... (mái néim is)","I am from... = Soy de... (ai am from)","Nice to meet you = Mucho gusto (náis tu mít iu)"],"pt":["Chamo-me... = My name is... (SHAH-moo-meh)","Sou de... = I am from... (soh deh)","Muito prazer = Nice to meet you (MWEE-too prah-ZEHR)"]},"s":{"en":"My name is {name}. I am from {city}. Nice to meet you. Now you. Three lines, ten seconds. Put your name and city in the comments and I will say hello back.","pt":"Chamo-me {name}. Sou do {city}. Muito prazer. Agora tu. Três frases, dez segundos. Escreve o teu nome e a tua cidade nos comentários e eu respondo."},"te":{"en":"Build a full introduction from three small pieces.","pt":"Construir uma apresentação completa com três peças pequenas."},"se":null},{"t":"Episode 5: Numbers one to ten","k":"Lesson, counting","tech":"Rhythm and repetition","h":{"en":"Count to ten with me. One breath.","pt":"Conta até dez comigo. Num só fôlego."},"sh":{"en":["0-3s: {name} holds up one finger.","3-10s: Numbers appear one by one with fingers, slow then natural.","10-12s: Ten fingers, a smile."],"pt":["0-3s: {name} levanta um dedo.","3-10s: Os números aparecem um a um com os dedos, devagar e depois natural.","10-12s: Dez dedos, um sorriso."]},"ot":{"en":["1 uno (guán) 2 dos (tu) 3 tres (zri)","4 cuatro (for) 5 cinco (fáiv)","6 seis (siks) 7 siete (séven) 8 ocho (éit) 9 nueve (náin) 10 diez (ten)"],"pt":["1 um (oong) 2 dois (doysh) 3 três (trehsh)","4 quatro (KWAH-troo) 5 cinco (SEEN-koo)","6 seis (saysh) 7 sete (set) 8 oito (OY-too) 9 nove (nov) 10 dez (desh)"]},"s":{"en":"One, two, three, four, five. Six, seven, eight, nine, ten. Again, a bit faster. Save this and count in the shower tomorrow.","pt":"Um, dois, três, quatro, cinco. Seis, sete, oito, nove, dez. Outra vez, um pouco mais depressa. Guarda e conta no duche amanhã."},"te":{"en":"Numbers by rhythm, repeated twice.","pt":"Números pelo ritmo, repetidos duas vezes."},"se":null},{"t":"Episode 6: Order a coffee","k":"Lesson with a café scene","tech":"Immediate usefulness","h":{"en":"Order your coffee like a regular. One sentence.","pt":"Pede o teu café como um habitual. Uma frase."},"sh":{"en":["0-3s: {name} at a counter, barista in the background.","3-9s: The sentence built word by word, then said naturally.","9-12s: Coffee slides across the counter, thumbs up."],"pt":["0-3s: {name} ao balcão, empregado ao fundo.","3-9s: A frase construída palavra a palavra, depois dita naturalmente.","9-12s: O café desliza no balcão, polegar para cima."]},"ot":{"en":["Can I have a coffee, please? = ¿Me da un café, por favor?","(kan ai jav a cófi plís)"],"pt":["Queria um café, por favor. = I would like a coffee, please.","(keh-REE-ah oong kah-FEH poor fah-VOR)"]},"s":{"en":"Can I have a coffee, please? Slowly: can I have a coffee, please? Add milk, please, and you are done. Order your next coffee with this and tell me how it went.","pt":"Queria um café, por favor. Devagar: queria um café, por favor. Acrescenta um galão, por favor, e está feito. Pede o próximo café com isto e conta-me como correu."},"te":{"en":"The single most useful ordering sentence.","pt":"A frase de pedido mais útil."},"se":{"en":"The café phrases are in the workbook in my bio.","pt":"As frases de café estão no caderno na bio."}},{"t":"Episode 7: How much is it?","k":"Lesson with a shop scene","tech":"Practical promise","h":{"en":"Never pay too much because you could not ask.","pt":"Nunca pagues a mais por não conseguires perguntar."},"sh":{"en":["0-3s: {name} holds a small item toward the shopkeeper.","3-9s: The question built slowly, then natural, then the answer with a number.","9-12s: Pay, small smile."],"pt":["0-3s: {name} segura num artigo pequeno e mostra ao lojista.","3-9s: A pergunta construída devagar, depois natural, depois a resposta com um número.","9-12s: Paga, sorriso pequeno."]},"ot":{"en":["How much is it? = ¿Cuánto cuesta? (jáu mach is it)"],"pt":["Quanto custa? = How much is it? (KWAN-too KOOSH-tah)"]},"s":{"en":"How much is it? Slowly: how much is it? Say it, then listen for the number. Eight dollars. Ten. Twelve. Which number did you hear first? Practise with the numbers from episode five.","pt":"Quanto custa? Devagar: quanto custa? Diz, e ouve o número. Oito euros. Dez. Doze. Qual número ouviste primeiro? Pratica com os números do episódio cinco."},"te":{"en":"A question you will use daily, plus listening practice.","pt":"Uma pergunta que vais usar todos os dias, mais treino de escuta."},"se":null},{"t":"Episode 8: Where is the station?","k":"Lesson with a street scene","tech":"Travel pain point","h":{"en":"Lost in a new city? These words save you.","pt":"Perdido numa cidade nova? Estas palavras salvam-te."},"sh":{"en":["0-3s: {name} looks at a map, frowns.","3-9s: The question, then the answers: left, right, straight ahead.","9-12s: {name} points down a street."],"pt":["0-3s: {name} olha para um mapa, franze o sobrolho.","3-9s: A pergunta, depois as respostas: esquerda, direita, em frente.","9-12s: {name} aponta ao fundo da rua."]},"ot":{"en":["Where is the station? = ¿Dónde está la estación? (uér is de stéishon)","left = izquierda · right = derecha · straight = derecho"],"pt":["Onde fica a estação? = Where is the station? (ON-deh FEE-kah ah shtah-SOWNG)","esquerda = left · direita = right · em frente = straight ahead"]},"s":{"en":"Where is the station? Slowly: where is the station? Then listen: left, right, straight ahead. Point with me. Left. Right. Straight. Which direction do you always forget?","pt":"Onde fica a estação? Devagar: onde fica a estação? Depois ouve: esquerda, direita, em frente. Aponta comigo. Esquerda. Direita. Em frente. Que direção esqueces sempre?"},"te":{"en":"One travel question plus the three direction words.","pt":"Uma pergunta de viagem mais as três palavras de direção."},"se":null},{"t":"Episode 9: Asking for help","k":"Lesson","tech":"Safety net","h":{"en":"The sentence that makes strangers help you.","pt":"A frase que faz estranhos ajudarem-te."},"sh":{"en":["0-3s: {name} with luggage looking around.","3-9s: The sentence built word by word, then natural.","9-12s: A person shows the way, {name} says thank you."],"pt":["0-3s: {name} com bagagem a olhar em redor.","3-9s: A frase construída palavra a palavra, depois natural.","9-12s: Alguém indica o caminho, {name} agradece."]},"ot":{"en":["Can you help me, please? = ¿Puede ayudarme, por favor? (kan iu jelp mi plís)"],"pt":["Pode ajudar-me, por favor? = Can you help me, please? (POH-deh ah-zhoo-DAR-meh poor fah-VOR)"]},"s":{"en":"Can you help me, please? Slowly: can you help me, please? Say it with a smile and people lean in. Put it with episode two: please, thank you. Save this for your next trip.","pt":"Pode ajudar-me, por favor? Devagar: pode ajudar-me, por favor? Diz com um sorriso e as pessoas aproximam-se. Junta ao episódio dois: por favor, obrigada. Guarda para a tua próxima viagem."},"te":{"en":"A polite request that works anywhere.","pt":"Um pedido educado que funciona em qualquer lado."},"se":null},{"t":"Episode 10: Recap and quiz","k":"Recap with a quiz","tech":"Challenge the viewer","h":{"en":"Can you answer all five? Test yourself.","pt":"Consegues responder às cinco? Põe-te à prova."},"sh":{"en":["0-3s: Title \"Season 1 quiz\", {name} points at the screen.","3-10s: Five short prompts appear, each with a three-second pause for the viewer.","10-12s: Score card and a challenge."],"pt":["0-3s: Título \"Quiz da temporada 1\", {name} aponta para o ecrã.","3-10s: Cinco perguntas curtas, cada uma com três segundos de pausa para quem vê.","10-12s: Cartão de pontuação e um desafio."]},"ot":{"en":["Quiz: 5 questions","Score: /5"],"pt":["Quiz: 5 perguntas","Pontuação: /5"]},"s":{"en":"Season one quiz. Five questions, three seconds each. How do you say hello? Thank you? How much is it? Where is the station? Help me? Score yourself and comment your number. Season two starts soon.","pt":"Quiz da temporada um. Cinco perguntas, três segundos cada. Como se diz olá? Obrigada? Quanto custa? Onde fica a estação? Ajuda-me? Dá-te uma nota e comenta o teu número. A temporada dois começa em breve."},"te":{"en":"Spaced recall of the first nine episodes.","pt":"Revisão espaçada dos primeiros nove episódios."},"se":{"en":"Every episode and the quiz as a printable workbook: link in bio.","pt":"Todos os episódios e o quiz num caderno para imprimir: link na bio."}},{"t":"Bonus: the sound that gives everyone trouble","k":"Pronunciation lesson, close-up","tech":"Common-mistake hook","h":{"en":"Spanish speakers always get this sound wrong. Here is the fix.","pt":"Quem fala inglês quase sempre erra este som. Aqui está a solução."},"sh":{"en":["0-3s: Close-up of {name}'s mouth, slow.","3-9s: The sound shown with tongue position, two examples, then natural speed.","9-12s: Try it with me, card with the tip."],"pt":["0-3s: Plano aproximado da boca de {name}, devagar.","3-9s: O som mostrado com a posição da língua, dois exemplos, depois velocidade normal.","9-12s: Tenta comigo, cartão com a dica."]},"ot":{"en":["TH: lengua entre los dientes","think, thank, three"],"pt":["Som nasal: ão","pão, mãe, irmão"]},"s":{"en":"The English th sound. Put your tongue gently between your teeth and blow. Think. Thank. Three. Do it with me. Not tank, not sank. Thank.","pt":"O som nasal português. Deixa o ar sair um pouco pelo nariz. Pão. Mãe. Irmão. Faz comigo. Não é pau, é pão."},"te":{"en":"One pronunciation trap with mouth position.","pt":"Uma armadilha de pronúncia com a posição da boca."},"se":null},{"t":"Bonus: small talk about the weather","k":"Lesson with a street scene","tech":"Social tool","h":{"en":"Start any conversation with one easy line.","pt":"Começa qualquer conversa com uma frase fácil."},"sh":{"en":["0-3s: {name} at a bus stop, looking at the sky.","3-9s: Two lines: nice day, cold today. Slow then natural.","9-12s: A neighbour answers, {name} smiles."],"pt":["0-3s: {name} numa paragem de autocarro, a olhar para o céu.","3-9s: Duas frases: está um bom dia, está frio hoje. Devagar e depois natural.","9-12s: Um vizinho responde, {name} sorri."]},"ot":{"en":["Nice day = Qué buen día (náis dei)","It is cold = Hace frío (it is kóuld)"],"pt":["Está um bom dia = Nice day (shtah oong bohng DEE-ah)","Está frio = It is cold (shtah FREE-oo)"]},"s":{"en":"Nice day today. Slowly: nice day today. It is cold, isn't it? Weather is the easiest way to start a chat. Use it in the lift, on the bus, at the shop. Try it this week.","pt":"Está um bom dia. Devagar: está um bom dia. Está frio, não está? O tempo é a maneira mais fácil de começar uma conversa. Usa no elevador, no autocarro, na loja. Experimenta esta semana."},"te":{"en":"Small talk as the first step to real conversation.","pt":"Conversa de circunstância como primeiro passo para uma conversa a sério."},"se":null}],"photos":[{"t":"Profile photo: the face","img":"Close portrait, café window light, cup blurred behind. Warm smile, relaxed. 4:5.","why":"The account face.","cap":{"en":"Hi, I am {name}. AI language coach. One phrase per episode.","pt":"Olá, sou {a} {name}. Treinador{a} de línguas de IA. Uma frase por episódio."}},{"t":"Café notebook","img":"Top-down café table: notebook with phrases, coffee, pen. 4:5.","why":"Sets the teaching context.","cap":{"en":"Today's phrase is already written.","pt":"A frase de hoje já está escrita."}},{"t":"Whiteboard lesson","img":"{name} writes a phrase on a small whiteboard in a bright room. 4:5.","why":"Teacher energy.","cap":{"en":"Episode planning.","pt":"A planear o episódio."}},{"t":"Carousel: five phrases","img":"Four slides: phrase, sound, meaning, use. Clean text. 4:5.","why":"Saved and shared a lot.","cap":{"en":"Swipe: five phrases for your next trip.","pt":"Desliza: cinco frases para a tua próxima viagem."}},{"t":"Out in {city}","img":"{name} on a street in {city} pointing at a sign, casual. 4:5.","why":"Real-world use of the language.","cap":{"en":"Lesson in the wild.","pt":"Lição no terreno."}},{"t":"Behind the scenes","img":"Flashcards everywhere, {name} laughing. 4:5.","why":"Warmth and trust.","cap":{"en":"Flashcard explosion.","pt":"Explosão de cartões."}}],"stories":[{"t":"Meet {name}","fr":["Selfie with \"Hi, I am {name}\"","Quick café tour","Text: \"AI coach, one phrase per episode\""],"st":"Link sticker","go":"Introduce the face and the AI label."},{"t":"Poll: which phrase next?","fr":["Three phrase   h+='<div class="note">Checked 5 Nov 2026 from web sources. Not legal advice. Verify locally before launch.</div>';
 }else if(s==='Prompts'){
  h+='<p style="color:var(--label2)">Ready to paste. Brackets and details are already filled for '+esc(p.name)+'.</p>';
  h+=promptHtml('1. First photo (OpenArt Image)',p.photo);
  h+=promptHtml('2. Voice description (Design a voice)',p.voice);
  h+=promptHtml('3. Backstory (paste in the character)',p.backstory);
  h+=promptHtml('4. Character sheet (16:9, with @'+p.name+')',p.sheet);
  h+=promptHtml('5. First video (Seedance 2.5)',p.video);
  h+=promptHtml('6. Ask Claude for native hooks and descriptions',p.ask);
  h+='<div class="note">Settings: GPT Image 2.5, 4:5, 4K, quality High, Auto Polish off. Video: Seedance 2.5, 9:16, 1080p, 12 s, audio on. Run the phonetic step for any brand name before the final line.</div>';
 }else if(s==='Checklist'){
  var ck=S.ck[id]||[];
  h+='<div class="grp">'+p.check.map(function(c,i){var on=ck.indexOf(i)>=0;return '<button class="check'+(on?' on':'')+'" data-do="ck" data-id="'+id+'" data-i="'+i+'" aria-pressed="'+on+'"><span class="box">'+svg('check',3)+'</span><span class="tx">'+esc(c)+'</span></button>'}).join('')+'</div>';
  h+='<h2>My notes</h2><textarea class="nt" id="nt" data-id="'+id+'" placeholder="Notes about '+esc(p.name)+'" aria-label="Notes">'+esc(S.nt[id]||'')+'</textarea>';
 }
 return h;
}

/* ---------- render ---------- */
function titleOf(c){
 if(c.v==='persona')return PK[c.id].name;if(c.v==='niche')return NK[c.id].name;if(c.v==='market')return MK[c.id].name;if(c.v==='plan-page')return PLK[c.id].title;
 return ({personas:'Personas',niches:'Niches',markets:'Languages',plan:'Plan'})[c.v]||'';
}
function viewHtml(c){
 copyStore=[];
 switch(c.v){case'personas':return vPersonas();case'niches':return vNiches();case'markets':return vMarkets();case'plan':return vPlan();
  case'persona':return vPersona(c.id);case'niche':return vNiche(c.id);case'market':return vMarket(c.id);case'plan-page':return vPlanPage(c.id);}
 return '';
}
function renderTop(){
 var c=cur(),back=nav.stack.length>0;
 top.innerHTML=(back?'<button class="glassbtn" data-do="back" aria-label="Back">'+svg('back',2.2)+'</button>':'<span></span>')+'<div class="t">'+esc(titleOf(c))+'</div>'+'<span></span>';
 top.classList.toggle('sc',scrollY>50);navbg.classList.toggle('sc',scrollY>8);navbg.classList.toggle('tall',c.v==='persona');
}
function renderTab(){
 tabbar.style.setProperty('--n',TABS.length);
 tabbar.innerHTML='<div class="tb-ind" style="width:calc((100% - .5rem)/'+TABS.length+');transform:translateX('+TABS.findIndex(function(t){return t[0]===nav.tab})*100+'%)"></div>'+
  TABS.map(function(t){return '<button class="tab" data-do="tab" data-v="'+t[0]+'" aria-label="'+t[1]+'"'+(t[0]===nav.tab?' aria-current="page"':'')+'>'+svg(t[2])+'<span>'+t[1]+'</span></button>'}).join('');
}
function renderView(){
 var c=cur();
 root.innerHTML='<main class="view cur'+(nav.stack.length?' pushed':'')+'">'+viewHtml(c)+'</main>';
 renderTop();
}
var animUntil=0;
function go(kind,fn){ // kind: fwd|back|none
 var old=root.querySelector('.view');var snap=null;
 if(kind!=='none'&&old&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  snap=document.createElement('div');snap.className='pg pg-old';
  var inner=old.cloneNode(true);inner.classList.remove('cur');inner.removeAttribute('id');
  inner.querySelectorAll('[id]').forEach(function(e){e.removeAttribute('id')});inner.setAttribute('aria-hidden','true');
  inner.style.transform='translateY('+(-scrollY)+'px)';snap.appendChild(inner);
 }
 fn();
 if(snap){
  document.body.appendChild(snap);
  var h=document.documentElement;h.classList.add('pg-run','pg-'+kind);
  if(kind==='back')snap.style.pointerEvents='none';
  animUntil=Date.now()+460;
  setTimeout(function(){snap.remove();h.classList.remove('pg-run','pg-fwd','pg-back')},460);
 }
}
function setTab(t){
 nav.tab=t;nav.stack=[];scrolls=[];nav.sec='Overview';renderTab();renderView();scrollTo(0,0);
}

/* ---------- toast ---------- */
var tt;function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('on')},1600)}
function copy(t){
 var done=function(){toast('Copied')};
 try{navigator.clipboard.writeText(t).then(done,function(){fallback(t);done()})}catch(e){fallback(t);done()}
}
function fallback(t){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0;font-size:16px';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-do]');if(!el)return;
 var d=el.dataset,a=d.do;
 if(Date.now()<animUntil&&(a==='open'||a==='back'))return;
 if(a==='tab'){
  tabbar.classList.remove('tap');void tabbar.offsetWidth;tabbar.classList.add('tap');setTimeout(function(){tabbar.classList.remove('tap')},650);
  if(d.v===nav.tab&&nav.stack.length===0){scrollTo({top:0,behavior:'smooth'});return}
  setTab(d.v);
 }else if(a==='open'){
  var vv=d.v==='plan'?'plan-page':d.v;
  scrolls.push(scrollY);go('fwd',function(){nav.stack.push({v:vv,id:d.id});nav.sec='Overview';renderView();scrollTo(0,0)});
 }else if(a==='back'){
  var by=scrolls.pop()||0;go('back',function(){nav.stack.pop();nav.sec='Overview';renderView();scrollTo(0,by)});
 }else if(a==='filters'){openSheet();
 }else if(a==='fclose'){closeSheet();
 }else if(a==='freset'){S.f={niche:'all',mkt:'all',g:'all'};save();if(sheetEl){document.getElementById('sb').innerHTML=sheetBody()}refreshList();
 }else if(a==='fset'){S.f[d.k]=d.v;save();if(sheetEl){var sb=document.getElementById('sb'),st=sb.scrollTop;sb.innerHTML=sheetBody();sb.scrollTop=st}refreshList();
 }else if(a==='clear'){S.f[d.k]='all';save();refreshList();
 }else if(a==='sec'){
  nav.sec=d.v;var y2=scrollY;var pill=document.querySelector('.pills');var left=pill?pill.scrollLeft:0;renderView();var p2=document.querySelector('.pills');if(p2)p2.scrollLeft=left;scrollTo(0,Math.min(y2,200));
 }else if(a==='plt'){
  nav.pl=d.v;nav.openItem=null;renderView();scrollTo(0,Math.min(scrollY,200));
 }else if(a==='plgo'){
  nav.pl=d.v;nav.openItem=d.k;renderView();var el=document.getElementById('it-'+d.k);if(el)scrollTo(0,Math.max(0,el.getBoundingClientRect().top+scrollY-150));
 }else if(a==='pdone'){
  S.pd=S.pd||{};S.pd[d.k]=!S.pd[d.k];if(!S.pd[d.k])delete S.pd[d.k];save();var on=!!S.pd[d.k];el.setAttribute('aria-pressed',on);el.textContent=on?'Done':'Mark as done';var sm=el.closest('details');if(sm){var nm=sm.querySelector('.dnum');if(nm)nm.classList.toggle('ok',on)}
 }else if(a==='status'){
  S.st[d.id]=d.v;save();var y3=scrollY;renderView();scrollTo(0,y3);
 }else if(a==='ck'){
  var ck=S.ck[d.id]||[],i=+d.i,ix=ck.indexOf(i);if(ix>=0)ck.splice(ix,1);else ck.push(i);S.ck[d.id]=ck;save();var y4=scrollY;renderView();scrollTo(0,y4);
 }else if(a==='copy'){
  var t=copyStore[+d.i];if(t!=null)copy(t);
 }else if(a==='theme'){
  S.theme=d.v;save();applyTheme();var y5=scrollY;renderView();scrollTo(0,y5);
 }else if(a==='export'){
  var lines=[];D.personas.forEach(function(p){var s=pStatus(p.id),n=S.nt[p.id],ck=(S.ck[p.id]||[]).length;if(s!=='review'||n||ck)lines.push(p.name+' ('+NK[p.niche].name+', '+MK[p.mkt].name+', '+gtxt(p.g)+'): '+stText(s)+', checklist '+ck+'/'+p.check.length+(n?'. Notes: '+n:''))});
  copy(lines.length?lines.join('\n'):'No review notes yet.');
 }
});
document.addEventListener('input',function(e){
 if(e.target.id==='q'){nav.q=e.target.value;refreshList()}
 else if(e.target.id==='nt'){S.nt[e.target.dataset.id]=e.target.value;save()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
var lastY=0,ticking=false;
addEventListener('scroll',function(){
 if(ticking)return;ticking=true;
 requestAnimationFrame(function(){
  ticking=false;var y=scrollY;
  top.classList.toggle('sc',y>50);navbg.classList.toggle('sc',y>8);
  if(y>lastY+8&&y>12)tabbar.classList.add('min');else if(y<lastY-8||y<=12)tabbar.classList.remove('min');
  lastY=y;
 });
},{passive:true});
var saved={};
function restore(){}
addEventListener('popstate',function(){});
matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);


/* ---------- swipe back from the left edge ---------- */
var sw={on:false,lock:false,x0:0,y0:0,dx:0,t0:0,view:null,prev:null,inner:null,dim:null};
function prevCtx(){var i=nav.stack.length-2;return i>=0?nav.stack[i]:{v:nav.tab}}
function swStart(){
 sw.view=root.querySelector('.view');if(!sw.view)return false;
 var c=prevCtx(),store=copyStore,html=viewHtml(c);copyStore=store;
 var pushed=nav.stack.length-1>0;
 sw.prev=document.createElement('div');sw.prev.className='pg-prev';sw.prev.setAttribute('aria-hidden','true');
 var y=scrolls.length?scrolls[scrolls.length-1]:0;
 sw.prev.innerHTML='<div class="view'+(pushed?' pushed':'')+'" style="transform:translateY('+(-y)+'px) translateX(-28%);transition:none">'+html+'</div><div class="dim"></div>';
 sw.inner=sw.prev.firstChild;sw.dim=sw.prev.lastChild;
 sw.prev.querySelectorAll('[id]').forEach(function(e){e.removeAttribute('id')});
 document.body.appendChild(sw.prev);
 sw.view.classList.add('sw');sw.view.style.transition='none';
 return true;
}
function swApply(dx){
 var W=innerWidth,p=Math.min(1,dx/W);
 sw.view.style.transform='translateX('+dx+'px)';
 var y=scrolls.length?scrolls[scrolls.length-1]:0;
 sw.inner.style.transform='translateY('+(-y)+'px) translateX('+(-28*(1-p))+'%)';
 sw.dim.style.opacity=(.22*(1-p)).toFixed(3);
}
function swClean(){if(sw.prev){sw.prev.remove()}if(sw.view){sw.view.classList.remove('sw');sw.view.style.transform='';sw.view.style.transition=''}sw.prev=sw.view=sw.inner=sw.dim=null;sw.on=false;sw.lock=false}
function swEnd(commit){
 var W=innerWidth,v=sw.view,inner=sw.inner,dim=sw.dim;animUntil=Date.now()+360;
 var ease='transform .32s cubic-bezier(.32,.72,0,1)';
 v.style.transition=ease;inner.style.transition=ease;dim.style.transition='opacity .32s';
 var y=scrolls.length?scrolls[scrolls.length-1]:0;
 if(commit){
  v.style.transform='translateX('+W+'px)';inner.style.transform='translateY('+(-y)+'px) translateX(0)';dim.style.opacity=0;
  setTimeout(function(){var by=scrolls.pop()||0;nav.stack.pop();nav.sec='Overview';var prev=sw.prev;sw.prev=null;renderView();scrollTo(0,by);if(prev)prev.remove();sw.view=null;swClean()},330);
 }else{
  v.style.transform='translateX(0)';inner.style.transform='translateY('+(-y)+'px) translateX(-28%)';dim.style.opacity=.22;
  setTimeout(swClean,330);
 }
}
document.addEventListener('touchstart',function(e){
 if(nav.stack.length===0||sheetEl||e.touches.length!==1||Date.now()<animUntil||sw.prev)return;
 var t=e.touches[0];if(t.clientX>30)return;
 sw.on=true;sw.lock=false;sw.x0=t.clientX;sw.y0=t.clientY;sw.dx=0;sw.t0=Date.now();
},{passive:true});
document.addEventListener('touchmove',function(e){
 if(!sw.on)return;var t=e.touches[0],dx=t.clientX-sw.x0,dy=t.clientY-sw.y0;
 if(!sw.lock){
  if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
  if(Math.abs(dy)>Math.abs(dx)||dx<0){sw.on=false;return}
  if(!swStart()){sw.on=false;return}
  sw.lock=true;
 }
 e.preventDefault();sw.dx=Math.max(0,dx);swApply(sw.dx);
},{passive:false});
function swFinish(){
 if(!sw.on)return;if(!sw.lock){sw.on=false;return}
 sw.on=false;var dt=Math.max(1,Date.now()-sw.t0),v=sw.dx/dt;
 swEnd(sw.dx>innerWidth*.33||v>.5);
}
document.addEventListener('touchend',swFinish);
document.addEventListener('touchcancel',function(){if(sw.on&&sw.lock){sw.on=false;swEnd(false)}else sw.on=false});

/* ---------- boot ---------- */
applyTheme();renderTab();renderView();
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
