<style>:root{

--lg-tint:rgba(255,255,255,.55);--lg-edge2:rgba(60,60,67,.16);--lg-rim:#fff;--lg-rim2:rgba(60,60,67,.2);--lg-act:rgba(120,120,128,.2);

--lg-ink:rgba(255,255,255,.88);--lg-sh:rgba(0,0,0,.34);--lg-spec:rgba(255,255,255,.05);--lg-flash:rgba(255,255,255,.26);--glow1:rgba(191,90,242,.42);--glow2:rgba(94,92,230,.26)}}

--bg:#000;--card:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
--acc:#B58CFF;--blue:#0A84FF;--red:#FF453A;--green:#30D158;--orange:#FF9F0A;--fill:rgba(120,120,128,.24);
--lg-tint:rgba(36,36,40,.58);--lg-edge2:rgba(255,255,255,.08);--lg-rim:rgba(255,255,255,.14);--lg-rim2:rgba(255,255,255,.04);--lg-act:rgba(255,255,255,.14);
--lg-ink:rgba(255,255,255,.88);--lg-sh:rgba(0,0,0,.34);--lg-spec:rgba(255,255,255,.05);--lg-flash:rgba(255,255,255,.26);--glow1:rgba(191,90,242,.42);--glow2:rgba(94,92,230,.26);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{margin:0;font:400 1.0625rem/1.4 var(--font);background:transparent;color:var(--label);min-height:100vh;min-height:100dvh;
padding-bottom:calc(7rem + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-touch-callout:none;user-select:none}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
html.pg-run{overflow-x:hidden}html.pg-run body{overflow-x:clip}
.nav-bg{position:fixed;inset:0 0 auto 0;height:calc(env(safe-area-inset-top) + 3.5rem);z-index:20;pointer-events:none;background:linear-gradient(var(--bg) 88%,color-mix(in srgb,var(--bg) 0%,transparent))}
.nav-bg::before{content:"";position:absolute;inset:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.top{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(env(safe-area-inset-top) + 3.6rem);padding:calc(env(safe-area-inset-top) + .5rem) 1rem 0;
display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.top .t{position:absolute;left:4.5rem;right:4.5rem;top:calc(env(safe-area-inset-top) + .75rem);text-align:center;font-weight:600;font-size:1.0625rem;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.top.sc .t{opacity:1}
.glassbtn{position:relative;width:2.75rem;height:2.75rem;border-radius:999px;display:grid;place-items:center;color:var(--lg-ink);
background:var(--lg-tint);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 4px 14px var(--lg-sh);transition:transform .2s}
.glassbtn:active{transform:scale(.92)}.glassbtn svg{width:1.4rem;height:1.4rem}
.glassbtn.sm{width:2.25rem;height:2.25rem}.glassbtn.sm::after{content:"";position:absolute;inset:-.25rem}
.view{padding:calc(env(safe-area-inset-top) + 3.4rem) 1rem 1rem;max-width:44rem;margin:0 auto}
.lt{font-size:2.125rem;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:.4rem 0 .25rem}
.sub{color:var(--label2);font-size:.9375rem;margin:0 0 1rem}
h2{font-size:1.25rem;font-weight:600;margin:1.6rem 0 .6rem}
h3{font-size:1.0625rem;font-weight:600;margin:0 0 .25rem}
p{margin:.3rem 0 .7rem}
.card{background:var(--card);border-radius:1.25rem;padding:1rem;margin:0 0 .75rem}
.card.tight{padding:0;overflow:hidden}
.grp{background:var(--card);border-radius:1.25rem;overflow:hidden;margin:0 0 .75rem}
.row{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.25rem;padding:.65rem 1rem;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:1rem;right:0;border-top:.5px solid var(--sep)}
.row:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{color:var(--label2);font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:.6rem;height:1rem;color:var(--label3);flex:none}
.av{width:2.75rem;height:2.75rem;border-radius:999px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.1rem;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2))}
.av.lg{width:4.5rem;height:4.5rem;font-size:1.9rem}
.ic{width:2.5rem;height:2.5rem;border-radius:.7rem;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ic svg{width:1.4rem;height:1.4rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.1rem 1rem .6rem;margin:0 -1rem;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:2.25rem;padding:.35rem .9rem;border-radius:999px;background:var(--card);font-size:.9375rem;font-weight:500;position:relative}
.chip[aria-pressed="true"],.chip.on{background:var(--label);color:var(--bg)}
.chip:active{opacity:.55}
.chip::after{content:"";position:absolute;inset:-.1rem 0}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:.12rem .55rem;border-radius:999px;background:var(--fill);color:var(--label2);margin:0 .3rem .3rem 0}
.tag.w1{background:rgba(52,199,89,.18);color:var(--green)}.tag.w2{background:rgba(10,132,255,.16);color:var(--acc)}
.tag.w3{background:rgba(255,149,0,.2);color:var(--orange)}.tag.w4{background:var(--fill)}
.tag.ok{background:rgba(52,199,89,.18);color:var(--green)}.tag.no{background:rgba(255,59,48,.16);color:var(--red)}.tag.verify{background:rgba(255,149,0,.2);color:var(--orange)}
.search{display:flex;align-items:center;gap:.5rem;background:var(--fill);border-radius:.8rem;padding:0 .8rem;margin:0 0 .7rem;min-height:2.75rem}
.search input{flex:1;background:none;border:0;outline:0;font-size:1rem;min-height:2.75rem;min-width:0}
.search svg{width:1rem;height:1rem;color:var(--label2);flex:none}
.pills{display:flex;gap:.4rem;overflow-x:auto;margin:0;padding:.35rem 1rem .9rem;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:2.25rem;padding:.3rem .85rem;border-radius:999px;font-size:.9375rem;font-weight:600;background:var(--card);color:var(--label2)}
.pill[aria-current="true"]{background:var(--label);color:var(--bg)}
.kv{display:grid;grid-template-columns:1fr;gap:.15rem;margin:0 0 .8rem}
.kv .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--label2);font-weight:600}
.kv .v{font-size:1rem}
.big{font-size:1.15rem;font-weight:600;line-height:1.3}
ul.l{margin:.2rem 0 .6rem;padding-left:1.15rem}ul.l li{margin:.3rem 0}
ol.s{list-style:none;margin:0;padding:0;counter-reset:s}
ol.s>li{position:relative;padding:.7rem 0 .7rem 2.6rem;border-top:.5px solid var(--sep)}
ol.s>li:first-child{border-top:0}
ol.s>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:.7rem;width:1.8rem;height:1.8rem;border-radius:999px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:700;font-size:.9rem;display:grid;place-items:center}
ol.s .st{font-weight:600}ol.s .sd{color:var(--label2);font-size:.9375rem}
.note{background:rgba(255,149,0,.14);border-radius:1rem;padding:.8rem 1rem;margin:.6rem 0;font-size:.9375rem}
.prompt{background:var(--fill);border-radius:1rem;padding:.8rem 1rem;margin:0 0 .75rem;font-size:.9375rem;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.ph{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin:.9rem 0 .35rem}
.ph h3{margin:0}
.btn{min-height:2.5rem;padding:.4rem 1rem;border-radius:999px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:600;font-size:.9375rem;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.8}.btn.sec{background:var(--fill);color:var(--acc)}
.btn.sm{min-height:2.25rem;padding:.25rem .8rem;font-size:.875rem}
.seg{display:flex;background:var(--fill);border-radius:.8rem;padding:.15rem;gap:.15rem;margin:.2rem 0 1rem}
.seg button{flex:1;min-height:2.75rem;border-radius:.65rem;font-weight:600;font-size:.9375rem;color:var(--label2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;gap:.75rem;align-items:flex-start;width:100%;text-align:left;padding:.7rem 1rem;min-height:2.75rem}
.check+.check{border-top:.5px solid var(--sep)}
.box{width:1.5rem;height:1.5rem;border-radius:999px;border:2px solid var(--label3);flex:none;display:grid;place-items:center;margin-top:.1rem}
.check.on .box{background:var(--green);border-color:var(--green);color:#fff}.check.on .tx{color:var(--label2);text-decoration:line-through}
.box svg{width:.9rem;height:.9rem;opacity:0}.check.on .box svg{opacity:1}
textarea.nt{width:100%;min-height:6rem;border:0;border-radius:1rem;background:var(--card);padding:.8rem 1rem;font-size:1rem;resize:vertical;outline:0}
.bar{height:.5rem;border-radius:999px;background:var(--fill);overflow:hidden;margin:.4rem 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc1),var(--acc2));border-radius:inherit}
.hero{border-radius:1.5rem;padding:1.2rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));margin:0 0 .9rem}
.hero .big{font-size:1.3rem}.hero p{opacity:.92;margin:.3rem 0 0}
.empty{text-align:center;color:var(--label2);padding:2rem 1rem}
.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom)*0);width:min(calc(100% - 2rem),36rem);transform:translateX(-50%);
display:flex;height:3.5rem;padding:.25rem;border-radius:999px;background:var(--lg-tint);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 6px 20px var(--lg-sh);
transition:width .4s cubic-bezier(.3,1.25,.4,1),height .4s cubic-bezier(.3,1.25,.4,1)}
.tabbar::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 20% 0,var(--lg-spec),transparent 60%);pointer-events:none}
.tabbar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--lg-flash);opacity:0;pointer-events:none}
.tabbar.tap{animation:tbzoom .65s}.tabbar.tap::after{animation:tbflash .65s}
@keyframes tbzoom{0%,100%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.018)}}
@keyframes tbflash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.tabbar.min{width:min(calc(100% - 6rem),calc(4.5rem*var(--n) + .5rem));height:3rem}
.tb-ind{position:absolute;top:.25rem;bottom:.25rem;left:.25rem;border-radius:999px;background:var(--lg-act);transition:transform .55s cubic-bezier(.3,1.25,.4,1)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;color:var(--lg-ink);font-size:.6875rem;font-weight:500}
.tab svg{width:1.5rem;height:1.5rem;transition:width .3s,height .3s}
.tab span{max-height:1rem;overflow:hidden;transition:max-height .3s,opacity .3s}
.tabbar.min .tab span{max-height:0;opacity:0}.tabbar.min .tab svg{width:1.4rem;height:1.4rem}
.tab[aria-current="page"]{color:var(--acc)}.tab:active{opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(5.6rem + env(safe-area-inset-bottom));transform:translate(-50%,1rem);opacity:0;z-index:60;padding:.6rem 1.1rem;border-radius:999px;background:var(--lg-tint);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 0 0 .5px var(--lg-edge2),0 6px 20px var(--lg-sh);font-weight:600;font-size:.9375rem;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pg{position:fixed;inset:0;z-index:15;pointer-events:none;background:var(--bg);overflow:hidden}
.pg .view{padding-top:calc(env(safe-area-inset-top) + 3.4rem)}
.pg-old{animation:none}
html.pg-fwd .view.cur{animation:pgin .42s cubic-bezier(.32,.72,0,1) both;position:relative;z-index:18;background:var(--bg);box-shadow:-10px 0 28px rgba(0,0,0,.22);min-height:100vh}
html.pg-fwd .pg-old{animation:pgunder .42s cubic-bezier(.32,.72,0,1) both}
html.pg-back .view.cur{animation:none}
html.pg-back .pg-old{z-index:19;animation:pgout .42s cubic-bezier(.32,.72,0,1) both;background:var(--bg);box-shadow:-10px 0 28px rgba(0,0,0,.22)}
@keyframes pgin{from{transform:translateX(100%)}to{transform:none}}

nd.","Curiosity: \"The one word that makes locals smile.\"","Number: \"Ten seconds, one phrase, you can say it today.\""],"desc":{"tt":"Hello and goodbye. Episode 1. Follow for the next one. Workbook in profile. #learnlanguages #languagetips #speaklikeanative #dailylanguage #aiinfluencer","ig":"Hello and goodbye. Episode 1 of the series. Save it and say it out loud. The full workbook is linked in my profile. (AI creator.) #learnlanguages #languagetips #speaklikeanative #dailylanguage #aiinfluencer","yt_title":"Hello and goodbye","yt":"In this Short: one phrase, said slowly and then at natural speed, with the phonetic spelling. The workbook is linked below. I am an AI creator. #Shorts #learnlanguages #languagetips #speaklikeanative #dailylanguage #aiinfluencer"},"rules":[["AI label","Norwegian AI-labelling rules were not researched; label the persona as AI and check advertising rules."],["Niche rule","A native speaker must check every episode before it goes out. Give a phonetic spelling for each new word. Never teach wrong or invented phrases."],["Language check","Have a native Norwegian speaker watch three sample clips with the sound on before scaling. Dialect mismatch; test heavily."],["Voice quality","Nordic voice quality is untested. Launch last and test heavily."],["Pronunciation","Every episode is checked by a native speaker. Phonetic respellings on screen are approximate."]],"check":["Chose the face from the first photo","Named and saved the character in OpenArt","Voice designed and tested with a normal sentence","Character sheet added","Three photos in different outfits and places","Native speaker checked three sample clips","Account created with AI label and bio","First 10 clips posted","Reviewed the numbers after 10 clips"],"ph":{"hello":["Hei","(hy)"],"thanks":["Takk","(tahk)"],"station":["Hvor er stasjonen?","(voor air stah-SHOON-en)"],"caption":["Hi","Thank you"]},"weather":"For outdoor shots add a warm coat and scarf.","hair":"long straight hair tucked behind one ear","outfit":"a smart-casual knit top and jeans","setting":"at a local café table with a notebook and a coffee"}],"plan":[{"id":"waves","title":"Launch waves and cost","sub":"What to build first and what it costs","icon":"flag","blocks":[["p","Do not launch everything at once. Each wave tests the format before adding more characters. Wave 1 uses English (US) and Portuguese (Portugal) as defaults; change them to the two languages you can judge best."],["cards",[["Wave 1 · about 3 weeks","Healthy food, Coding and AI, Design in two languages you can judge: six personas (12 with both genders). 10 clips each. Record views, follows, link clicks, sales."],["Wave 2","Add Gadgets, Home finds and Language learning in the languages that worked."],["Wave 3","Add one betting persona only after a legal check in an allowed market, and only with real bets and real results."],["Wave 4","The remaining languages. Nordic ones last because voice quality is untested and they need native review."]]],["h","Fix before you scale"],["p","If a persona has no traction after 10 clips, change the angle (hook, video type, niche focus) before adding more characters. Do not judge in 7 days: the 7-day challenge account that was written off later had a video pass 250,000 views."],["h","Credits and cost"],["list",["A 12 s video cost about 3,850 credits in the tutorial, so 10 clips for one persona is about 38,500 credits.","Six personas at 10 clips each is about 231,000 credits at the tutorial price.","A 4K photo cost about 245 credits; a 15 s video about 4,800.","What a credit costs in money was not stated. Check your plan before planning many clips."]],["note","Later languages to consider (general knowledge, not researched): Swedish, Dutch, Polish, Hindi and Indian English, Indonesian, Turkish, Arabic."]]},{"id":"stages","title":"Build a persona, step by step","sub":"Stages 1 to 7 with prompts","icon":"steps","blocks":[["p","The same seven stages for every persona. Each persona page has its own filled-in prompts. Settings come from the tutorial (Oct 2026); if your screen differs, trust the screen."],["steps",[["1. Design the character and first photo","In OpenArt: Image, GPT Image 2.5 (Sunburst for quality, Flare for speed), Auto Polish off, 4:5, 4K, quality High. Paste the photo prompt. The result should look like a casual phone photo, not a studio shoot."],["2. Name","One word, no spaces, no accents, easy to type. It becomes the @Name tag."],["3. Voice and backstory","Design a voice (Clone needs a recording). Test it on an ordinary sentence in the persona's language. Backstory: 3 to 4 sentences, no looks, clothes or places, or the character gets locked to one outfit or location."],["4. Create the character","Character, Create character, Start from an image, add the photo and name, add the voice, paste the backstory, Create."],["5. Character sheet","Three panels on gray: headless front, rear, face close-up. Then Character, Browse library, gear icon, Add additional angles."],["6. Photo set","Character image with @Name; three everyday moments in different places and clearly different outfits. Describe the outfit in full every time."],["7. Videos","Character video: Seedance 2.5, 9:16, 1080p, 12 s (15 s for explainers), audio on. Add the matching photo as @image1 to keep place and outfit. Run the hook step and the phonetic step first."]]],["h","Common problems"],["list",["Saved outfit or tote bag returns: the prompt lacked a full outfit description.","A different person appears: character not saved, or @Name missing.","Face not recognised: add a character sheet with a clear face close-up.","Stuck in one outfit or place: the backstory mentioned clothes or places.","Video changes place or outfit: add the matching photo as a second reference.","Voice sounds like an ad: ask for casual, unpolished wording and test an ordinary sentence.","A brand is mispronounced: redo the phonetic step.","Speech sounds translated: rewrite natively and get a native speaker to check."]]]},{"id":"hooks","title":"Hooks and stop-scroll","sub":"The first 3 seconds of every video","icon":"hook","blocks":[["p","Based on common creator guides, not platform-confirmed rules. For every video Claude writes three hook variants in the persona's native register; you pick one. Viewers decide to swipe within about 3 seconds."],["h","Structure of each clip (15 to 45 seconds)"],["steps",[["Hook · 0 to 3 s","One sentence or image that makes the next second necessary."],["Bridge · 3 to 8 s","Promise what is coming and why it matters, without giving it away."],["Payoff","The recipe, build, redesign, test or lesson. Show the result."],["Soft close and loop","One low-pressure line; cut the end so it flows back into the first frame."]]],["h","Hook types to rotate"],["cards",[["Curiosity gap","State the result, hide the method."],["Contrarian","Challenge a common belief."],["Specific number","\"Four ingredients, nine minutes, 410 kcal.\""],["Mistake or warning","Name a costly error."],["Before and after","Show the end state first."],["Direct call-out","\"If you can't cook, watch this.\""],["Open loop","Start mid-story."],["Pattern interrupt","Sudden close-up or sound change."]]],["h","Stop-scroll techniques (use at least two)"],["list",["Visual: open on motion or a striking close-up; no logo, no slow fade-in, no \"hi guys\"; the result in the first second; eye contact.","Text: large, bold, high-contrast hook text in frame one, in the persona's language, inside the safe area; burned-in captions for the whole clip.","Audio: spoken hook in the first second, a sound change near 3 s, a trending sound where supported.","Pacing: a cut, zoom or new angle every 2 to 4 seconds; no dead air."]],["h","Measure"],["list",["Share still watching at 3 seconds","Average watch time as a percent of length","Saves, shares and link clicks"]],["note","If viewers leave before 3 seconds, change the hook, not the video. Test three hook variants. Never use a hook translated from English: write it as a native creator would say it."]]},{"id":"sell","title":"Selling without selling","sub":"Create desire without sounding like an ad","icon":"tag","blocks":[["p","Each video gives something useful first. The offer appears as the natural next step. The viewer should want the next thing, not be told to buy."],["h","Rotate three post types"],["cards",[["Value-first · about 60%","Useful tip, recipe, build, lesson or result. No offer, or only \"more in my profile\"."],["Story · about 25%","A problem and how it was solved, with the product inside the story."],["Soft call to action · about 15%","The product in use plus one calm line."]]],["note","The 60/25/15 split is a starting suggestion; the sources give no fixed ratio. Test it."],["h","Techniques"],["list",["Show, don't pitch: demonstrate the plan, app or before and after in use.","Normalize the mention: the offer is part of the routine.","Create the need first: make the viewer's problem vivid, then show the way out.","Answer the unspoken doubt: \"does it work for a beginner?\"","Open loops across a series: end Part 1 with the question Part 2 answers.","Real proof only: real screenshots, real results, honest limits."]],["h","Soft call-to-action lines"],["list",["\"The full plan is in my bio if you want it, no pressure.\"","\"I put the whole thing in one file, link's in my profile.\"","\"Part 2 tomorrow.\""]],["note","Avoid \"Limited time only!\" and \"Don't miss out!\" Disclose affiliate or paid content in the video and the description."]]},{"id":"desc","title":"Descriptions per platform","sub":"TikTok, Instagram Reels, YouTube Shorts","icon":"text","blocks":[["p","Claude writes all three for every video, three versions each, in the persona's language. Each persona page has an English draft for clip 1 and a ready-to-copy request for Claude."],["cards",[["TikTok","Best length 15 to 60 s. First line: the hook plus the main keyword. 1 to 3 short lines and a question to trigger comments. 4 to 7 hashtags: 3 to 5 trending and relevant plus 1 or 2 niche. Use TikTok's AI-generated content label and \"AI creator\" in the profile."],["Instagram Reels","Best length 15 to 90 s. The hook goes before the \"more\" cut. 2 to 4 short lines with line breaks; a story or a save-worthy list. 5 to 10 niche hashtags at the end or in the first comment. Use the AI label setting and the Paid partnership label when it applies."],["YouTube Shorts","Under 60 s (up to 3 min). Searchable title with the main keyword; no hashtags in the title. Description 100 to 300 words, keywords used naturally, chapters if over 60 s. 3 to 5 hashtags including #Shorts. Turn on the altered or synthetic content disclosure; mention affiliate links."]]],["h","Rhythm and file"],["list",["From one guide (verify): TikTok and Reels 5 to 7 per week, Shorts 1 to 2 per day.","Upload the original full-resolution file, not a screen recording.","Keep key elements centred; Reels crop to 4:5 in the feed."]],["h","Worked example · Healthy food, English (US)"],["prompt","TikTok","Seven dinners under 450 kcal and I only shopped once. Which day would you cook first? Part 2 tomorrow. Plan is in my profile. #mealprep #healthyrecipes #caloriedeficit #easydinner #aiinfluencer"],["prompt","Instagram","Dinner used to be my biggest calorie trap. So I planned the whole week in one shop: seven meals, every one under 450 kcal. Save this for your next grocery run. The full plan is linked in my profile. (I'm an AI creator.) #mealprep #healthyrecipes #easydinners #caloriedeficit"],["prompt","YouTube Shorts title and description","7 dinners under 450 kcal (one grocery trip)\n\nSeven simple dinners, each under 450 kcal, from one grocery trip. In this Short: the shopping list, the portions and the swap that cut the most calories. The complete printable week plan is linked below. I'm an AI creator; the link is a product link where stated. #Shorts #mealprep #healthyrecipes #caloriedeficit"]]},{"id":"nat","title":"Naturality standard","sub":"Looks, movement, speech","icon":"eye","blocks":[["p","Spotless means the same believable face every time, motion a viewer does not question, and speech a native speaker accepts as their own. Run this on every clip."],["h","Look"],["list",["Real imperfections (skin texture, freckles, flyaway hair), no beauty-filter gloss, Auto Polish off.","Phone-camera feel: candid framing, slight tilt, natural noise.","Local details that match the market: language on signs, plugs, cars, clothes for the weather, plausible local cafes and kitchens.","A full outfit description in every prompt."]],["h","Movement"],["list",["Clips of 12 seconds or less, one action each, handheld or selfie style, at most one camera move.","Ask for the action second by second.","Check hands and fingers, blinking, eye line, teeth, jewellery flicker, background text, extra people, outfit continuity and audio glitches. Regenerate rather than fix."]],["h","Speech"],["list",["One or two short sentences per 12-second clip, written the way people talk, not the way ads read.","Use the filler words and rhythm of the language, and have a native speaker confirm them.","Use the register a creator would use on camera, not textbook speech."]],["note","Before scaling any persona: make three sample clips, have a native speaker watch them with the sound on, save the persona bible, and re-check the pronunciation of every brand and foreign name. The tutorial only showed English; native voice quality in other languages is untested."]]},{"id":"brand","title":"Brands and phonetic spelling","sub":"Always ask before writing the final line","icon":"mic","blocks":[["p","Voice models mispronounce brand names, app names, acronyms and foreign words. Whenever a script names one, Claude stops and asks you how it should sound."],["steps",[["List every risky word","Brands, product and app names, people's names, acronyms, URLs, prices and numbers."],["Ask one question per word","\"How should [brand] sound when [persona] says it in [language]?\" Claude may suggest a spelling; you confirm it, because only a native speaker knows the local sound."],["Write the line with the confirmed spelling","Keep the correct spelling in the on-screen text or caption."],["Listen and fix","Report any word that still sounds wrong; regenerate only that clip."],["Keep a glossary per persona","Reuse it in later scripts."]]],["list",["Write numbers and prices out in words in the spoken line.","Do not read web addresses aloud: say \"link in bio\" and show it on screen.","Show a real product only when the team bought and filmed it; otherwise plain unbranded props.","In language-learning episodes, give each new word a phonetic spelling too."]]]},{"id":"rules","title":"Rules and risks","sub":"Checked 5 Nov 2026 · not legal advice","icon":"shield","blocks":[["note","These come from web sources, not lawyers. Verify locally before launch."],["h","AI labelling and sponsored content"],["cards",[["United States","FTC endorsement guides cover virtual influencers. Paid or affiliate links need a clear disclosure, and the source advises also saying the influencer is virtual, inside the video."],["European Union","AI Act Article 50 applies from 2 August 2026. Tool providers must mark AI output in machine-readable form; people making deepfakes must disclose it. Tools already on the market get until 2 December 2026 for the marking duty. Whether a fully invented person counts as a deepfake was not settled in the source, so label anyway."],["France","France: the 2023 influencer law requires \"Publicité\" or \"Collaboration commerciale\" on sponsored posts and \"Image virtuelle\" on AI-generated posts. Influencers and advertisers share liability, and influencers answer for dropshipped products."],["UK, Norway, Brazil, Latin America","Not researched. Label the persona as AI and check the local advertising rules."]]],["h","Sports betting promotion by market"],["cards",[["English (US)","US betting promotion is state by state and was not verified. Check each state and get legal advice before any betting persona. Show 21+ and a responsible-gambling message."],["English (UK)","UK: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Spanish (Latin America)","Latin American betting promotion varies by country and was not verified. Pick one country and check its regulator before any betting persona."],["Portuguese (Brazil)","Brazil regulates betting and its advertising, but this was not verified here. Check the current rules with a lawyer before any betting persona."],["Portuguese (Portugal)","Portuguese betting promotion rules were not verified. Check the regulator (SRIJ) and get legal advice before any betting persona."],["French","France: since the law of 9 June 2023 influencers may not promote paid sports-tip subscriptions, and tip services cannot be presented as improving the chance of winning. No betting persona in France."],["Italian","Italy: near-total ban; influencer ads and affiliate marketing for betting are prohibited. No betting persona in Italy."],["German","Germany: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Finnish","Finland: state gambling monopoly; promoting other operators is illegal marketing, and a new law from 1 July 2027 effectively bans influencers from distributing even licensed operators' marketing. No betting persona."],["Danish","Denmark: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Norwegian","Norway: promotion is limited to the two monopoly operators; helping market sites licensed elsewhere is illegal. No betting persona."]]],["h","Content rules wherever betting is used"],["list",["Real account, real bets, real outcomes including losses.","No claims that tips improve the chance of winning or guarantee profit.","Show the age limit and a responsible-gambling message.","Check the app and its promotion are legal in that market.","Disclose the affiliate link and that the persona is AI."]],["h","Other"],["list",["Healthy food: kcal and portions as information, no extreme diets or medical promises.","Never base a persona on a real person's face or voice.","Check OpenArt's terms on commercial use of outputs and saved characters.","Check tax or business registration where you live."]]]},{"id":"teaser","title":"Adult-adjacent persona (women only)","sub":"What is possible and what is not","icon":"lock","blocks":[["p","You asked for a women-only persona with more natural, more erotic videos to send visitors to a subscription page. I can help build a suggestive-but-not-explicit teaser persona. I will not write or plan explicit sexual content."],["h","Where the subscription page can live"],["cards",[["OnlyFans","One third-party source (checked 5 Nov 2026) reports that the October 2026 Terms require AI content to clearly feature the verified creator and prohibit wholly AI-generated accounts. A fully invented persona is likely not allowed. Verify with OnlyFans' own terms or support."],["Fanvue","Its help page says fully AI virtual characters are allowed if you pass ID verification, label the account clearly as AI, never tell fans she is real, and the character looks clearly adult. It must not resemble a real identifiable person without documented consent. Verify the current wording."]]],["h","Where teasers can be posted"],["list",["TikTok bans content promoting sexual solicitation, including premium sexual content. A 2021 report said linking an OnlyFans from a profile got accounts banned; policies may have changed.","Instagram and YouTube restrict sexually suggestive content, nudity and adult-service promotion.","On those three platforms the persona stays lifestyle-level and does not mention, link or hint at an adult page where the rules forbid it.","No coded wording, hidden links or other ways around moderation."]],["h","The persona"],["list",["Clearly an adult woman (25 or older in appearance), an invented face, no real person's likeness.","Warm, confident, flirty personality; everyday settings; natural movement and speech.","Clearly labelled as AI in the bio and with each platform's AI label.","Suggestive means styling, framing and personality at roughly PG-13 level."]],["h","Keep out"],["list",["Anything that could read as a minor.","Deepfakes or content from other people's photos.","Claims she is a real woman, or fake private messages.","Explicit content: I will not write it, and image tools usually restrict it."]],["note","Launch after Wave 1, once lifestyle content shows an audience, and only after reading the current rules of the subscription site and each posting platform."]]},{"id":"caveats","title":"Honest expectations","sub":"What the tutorials really showed","icon":"scale","blocks":[["list",["The only real-money result: 23 workbook sales at $12 = $276 revenue, minus $19.52 payment fees and a $99 tool plan = $157.48 profit in a week, short of the author's $1,000 goal.","Both tutorials carry affiliate links and one is sponsored. Results shown are curated; real work includes retries and wasted credits.","Label every account as AI. Do not present generated people, testimonials or sponsored content as a real person's genuine experience.","Not covered by the tutorials: OpenArt's commercial terms, the money cost per credit, each platform's current rules for AI accounts, and tax rules."]],["h","Strategy from the 7-day challenge"],["list",["Research first: study existing AI accounts and how they earn.","Make the character distinctive, not generic.","Test several accounts, about 10 videos each, and compare.","Ways to earn: brand deals (slow), physical products, affiliate (quick), digital products (a structured workbook sold for $12 and linked from the bio).","Use the persona to gain attention, then put one offer in front of that audience through the bio link."]]]},{"id":"week","title":"First-week plan","sub":"Five steps to start","icon":"calendar","blocks":[["steps",[["1. Check credits and terms","Pick a niche, market and a distinctive character concept."],["2. Build the character","Stages 1 to 5. Save the persona bible."],["3. Make content","Three photos, one talking video from a photo, one selfie video. Run the hook step, the naturality checklist and the phonetic step. Write the three platform descriptions."],["4. Create the account","AI label and a clear bio. Post 5 to 10 clips over several days, with captions."],["5. Review","After a week, note which hooks and video types got views. Only then choose how the persona earns."]]]]}],"epis":[["Season 1: Basics",["Hello and goodbye","Please, thank you, sorry","Yes, no, I do not understand","Introduce yourself","Numbers 1 to 10","Order a coffee","How much is it?","Where is the station?","Asking for help","Recap and quiz"]],["Season 2: Eating and shopping",["Menu words","Allergies and preferences","Order dinner","Pay the bill","At the market","Sizes and colours","Asking for a discount","Complimenting the food","Small talk about the weather","Recap and quiz"]],["Season 3: Getting around",["Train tickets","Taxi and ride-hailing","Directions","Hotel check-in","Time and dates","Emergencies","Making plans","Texting slang","A mini conversation","Finale quiz"]]]};</script>

 h+='<h2>What to measure</h2><div class="card"><ul class="l">'+n.kpis.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
 if(id==='lang'){
  h+='<h2>30-episode plan</h2>'+D.epis.map(function(s,si){return '<div class="card"><h3>'+esc(s[0])+'</h3><ol class="s" style="counter-reset:s '+(si*10)+'">'+s[1].map(function(e){return '<li><div class="st">'+esc(e)+'</div></li>'}).join('')+'</ol></div>'}).join('');
 }
 h+='<h2>Personas in this niche</h2>';
 D.markets.forEach(function(m){
  var l=ps.filter(function(p){return p.mkt===m.id});if(!l.length)return;
  h+='<div class="grp">'+l.map(personaRow).join('')+'</div>';
 });
 return h;
}
function vMarket(id){
 var m=MK[id],ps=D.personas.filter(function(p){return p.mkt===id});
 var h='<div class="hero" style="--c1:#BF5AF2;--c2:#5E5CE6">'+flag(m.id)+'<div class="big">'+esc(m.name)+'</div><p>Target city: '+esc(m.city)+' · prices in '+esc(m.cur)+'</p></div>';
 h+='<div class="card">'+kv('Speak it as',m.speech)+kv('Voice accent',m.accent)+kv('Watch out for',m.watch)+kv('Natural filler words',m.fillers)+'</div>';
 h+='<h2>Local details to show</h2><div class="card"><ul class="l">'+m.local.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
 h+='<h2>AI label and sponsored posts</h2><div class="note">'+esc(m.ai)+'</div>';
 h+='<h2>Sports betting here</h2><p>'+betTag(m)+'</p><div class="card"><p style="margin:0">'+esc(m.bet[1])+'</p></div>';
 h+='<h2>Local dish for the food persona</h2><div class="card"><p style="margin:0">'+esc(m.dish)+'</p></div>';
 var lp=ps.filter(function(p){return p.niche==='lang'})[0];
 if(lp&&lp.ph){
  h+='<h2>Language-learning sample phrases</h2><div class="card">'+kv('Hello',lp.ph.hello[0]+'  '+lp.ph.hello[1])+kv('Thank you',lp.ph.thanks[0]+'  '+lp.ph.thanks[1])+kv('Where is the station?',lp.ph.station[0]+'  '+lp.ph.station[1])+'<div style="color:var(--label2);font-size:.875rem">Respellings are approximate. A native speaker must confirm every phrase.</div></div>';
 }
 h+='<h2>Personas</h2>';
 D.niches.forEach(function(n){
  var l=ps.filter(function(p){return p.niche===n.id});if(!l.length)return;
  h+='<div style="color:var(--label2);font-size:.8125rem;font-weight:600;margin:.4rem .25rem">'+esc(n.name)+'</div><div class="grp">'+l.map(personaRow).join('')+'</div>';
 });
 return h;
}
var SECS=['Overview','Look and voice','Content','Sell','Rules','Prompts','Checklist'];
function vPersona(id){
 var p=PK[id],n=NK[p.niche],m=MK[p.mkt],st=pStatus(id);
 var h='<div style="display:flex;gap:1rem;align-items:center;margin:.3rem 0 1rem">'+avHtml(p,'lg')+'<div><h1 class="lt" style="margin:0">'+esc(p.name)+'</h1><div style="color:var(--label2)">'+esc(n.name)+' · '+flag(p.mkt,'s')+esc(m.name)+'</div></div></div>';
 h+='<div>'+tagW(p.wave)+'<span class="tag g'+p.g+'">'+gtxt(p.g)+', '+p.age+'</span><span class="tag">'+esc(m.city)+'</span>'+(p.niche==='bet'?betTag(m):'')+'</div>';
 h+='<div class="seg" role="group" aria-label="Review status" style="margin-top:.5rem">'+[['review','To review'],['ok','Approved'],['skip','Skip']].map(function(s){return '<button aria-pressed="'+(st===s[0])+'" data-do="status" data-id="'+id+'" data-v="'+s[0]+'">'+s[1]+'</button>'}).join('')+'</div>';
 h+='<div class="pw"><div class="pills" role="tablist">'+SECS.map(function(s){return '<button class="pill" role="tab" aria-current="'+(nav.sec===s)+'" data-do="sec" data-v="'+s+'">'+s+'</button>'}).join('')+'</div></div>';
 h+=secHtml(p,n,m);
 return h;
}
function secHtml(p,n,m){
 var s=nav.sec,h='',id=p.id;
 if(s==='Overview'){
  h+='<div class="card"><div class="big">'+esc(p.angle)+'</div><p style="color:var(--label2);margin-bottom:0">The signature angle that makes this persona distinctive rather than generic.</p></div>';
  h+='<div class="card">'+kv('Niche',n.name+': '+n.tagline)+kv('Market',m.name+' · '+m.city)+kv('Wave',p.wave===1?'Wave 1: build first (default test languages: English US and Portuguese Portugal)':p.wave===2?'Wave 2: after Wave 1 works':p.wave===3?'Wave 3: only after a legal check':'Wave 4: later markets'+(['fi','dk','no'].indexOf(p.mkt)>=0?' (Nordic: last)':''))+kv('Account bio',p.bio)+(p.learner?kv('Audience',(p.niche==='lang'&&['us','uk'].indexOf(p.mkt)>=0?'Learners of English; captions in '+p.learner:'English speakers learning '+m.lang+'; captions in English')):'')+'</div>';
  h+='<h2>Backstory</h2><div class="card"><p style="margin:0">'+esc(p.backstory)+'</p></div>';
  h+='<div class="note">'+esc(n.what)+'</div>';
 }else if(s==='Look and voice'){
  h+='<div class="card">'+kv('Age and gender',p.age+', '+gtxt(p.g).toLowerCase())+kv('Hair',p.hair)+kv('Outfit for the saved look',p.outfit)+kv('Setting',p.setting)+kv('Weather note',p.weather)+'</div>';
  h+='<div class="card">'+kv('Voice',p.voice)+kv('Speak it as',m.speech)+kv('Natural filler words',m.fillers)+kv('Watch out for',m.watch)+'</div>';
  h+='<div class="note">The face is yours to choose from the generated photo. Check that it resembles no real person. Native voice quality in '+esc(m.lang)+' is untested: test it on an ordinary sentence.</div>';
  h+='<h2>Local details to show</h2><div class="card"><ul class="l">'+m.local.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
 }else if(s==='Content'){
  h+='<h2 style="margin-top:.2rem">Series</h2>'+n.series.map(function(x){return '<div class="card"><h3>'+esc(x[0].replace('{cur}',m.cur))+'</h3><p style="margin:.2rem 0 0;color:var(--label2)">'+esc(x[1])+'</p></div>'}).join('');
  h+='<h2>First 10 clips</h2><div class="card"><ol class="s">'+p.clips.map(function(c){return '<li><div class="st">'+esc(c.title)+'</div><div class="sd">'+esc(c.kind)+'</div></li>'}).join('')+'</ol></div>';
  h+='<h2>Hook variants for clip 1</h2><div class="card"><ul class="l">'+p.hooks.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div><div class="note">These are English patterns. Ask Claude (Prompts tab) to write native '+esc(m.lang)+' versions.</div>';
  if(p.niche==='lang'){
   h+='<h2>30-episode plan</h2>'+D.epis.map(function(se,si){return '<div class="card"><h3>'+esc(se[0])+'</h3><ol class="s" style="counter-reset:s '+(si*10)+'">'+se[1].map(function(e){return '<li><div class="st">'+esc(e)+'</div></li>'}).join('')+'</ol></div>'}).join('');
   if(p.ph)h+='<h2>First phrases</h2><div class="card">'+kv('Hello',p.ph.hello[0]+'  '+p.ph.hello[1])+kv('Thank you',p.ph.thanks[0]+'  '+p.ph.thanks[1])+kv('Where is the station?',p.ph.station[0]+'  '+p.ph.station[1])+'<div style="color:var(--label2);font-size:.875rem">Approximate respellings. A native speaker must confirm.</div></div>';
  }
 }else if(s==='Sell'){
  h+='<div class="card">'+kv('Offer',n.offer)+kv('Price range',p.price)+kv('Product ladder',n.ladder.join(' → '))+'</div>';
  h+='<h2>How it sells without selling</h2><div class="card"><ul class="l"><li>About 60% value-first posts, 25% story posts, 15% soft call to action.</li><li>Show the result first, then let the offer appear as the next step.</li><li>One calm line: "The full plan is in my bio if you want it, no pressure."</li></ul></div>';
  h+='<h2>Descriptions for clip 1 (English draft)</h2>'+promptHtml('TikTok',p.desc.tt)+promptHtml('Instagram Reels',p.desc.ig)+promptHtml('YouTube Shorts title',p.desc.yt_title)+promptHtml('YouTube Shorts description',p.desc.yt);
  h+='<div class="note">Claude writes the finished versions in '+esc(m.lang)+'. Use the request in the Prompts tab.</div>';
  h+='<h2>What to measure</h2><div class="card"><ul class="l">'+n.kpis.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
 }else if(s==='Rules'){
  h+=p.rules.map(function(r){return '<div class="card"><h3>'+esc(r[0])+'</h3><p style="margin:.2rem 0 0;color:var(--label2)">'+esc(r[1])+'</p></div>'}).join('');
  h+='<div class="note">Checked 5 Nov 2026 from web sources. Not legal advice. Verify locally before launch.</div>';
 }else if(s==='Prompts'){
  h+='<p style="color:var(--label2)">Ready to paste. Brackets and details are already filled for '+esc(p.name)+'.</p>';
  h+=promptHtml('1. First photo (OpenArt Image)',p.photo);
  h+=promptHtml('2. Voice description (Design a voice)',p.voice);
  h+=promptHtml('3. Backstory (paste in the character)',p.backstory);
  h+=promptHtml('4. Character sheet (16:9, with @'+p.name+')',p.sheet);
  h+=promptHtml('5. First video (Seedance 2.5)',p.video);
  h+=promptHtml('6. Ask Claude for native hooks and descriptions',p.ask);
  h+='<div class="note">Settings: GPT Image 2.5, 4:5, 4K, quality High, Auto Polish off. Video: Seedance 2.5, 9:16, 1080p, 12 s, audio on. Run the phonetic step for any brand name before the final line.</div>';
 }else if(s==='Checklist'){
  var ck=S.ck[id]||[];
  h+='<div class="grp">'+p.check.map(function(c,i){var on=ck.indexOf(i)>=0;return '<button class="check'+(on?' on':'')+'" data-do="ck" data-id="'+id+'" data-i="'+i+'" aria-pressed="'+on+'"><span class="box">'+svg('check',3)+'</span><span class="tx">'+esc(c)+'</span></button>'}).join('')+'</div>';
  h+='<h2>My notes</h2><textarea class="nt" id="nt" data-id="'+id+'" placeholder="Notes about '+esc(p.name)+'" aria-label="Notes">'+esc(S.nt[id]||'')+'</textarea>';
 }
 return h;
}

/* ---------- render ---------- */
function titleOf(c){
 if(c.v==='persona')return PK[c.id].name;if(c.v==='niche')return NK[c.id].name;if(c.v==='market')return MK[c.id].name;if(c.v==='plan-page')return PLK[c.id].title;
 return ({personas:'Personas',niches:'Niches',markets:'Languages',plan:'Plan'})[c.v]||'';
}
function viewHtml(c){
 copyStore=[];
 switch(c.v){case'personas':return vPersonas();case'niches':return vNiches();case'markets':return vMarkets();case'plan':return vPlan();
  case'persona':return vPersona(c.id);case'niche':return vNiche(c.id);case'market':return vMarket(c.id);case'plan-page':return vPlanPage(c.id);}
 return '';
}
function renderTop(){
 var c=cur(),back=nav.stack.length>0;
 top.innerHTML=(back?'<button class="glassbtn" data-do="back" aria-label="Back">'+svg('back',2.2)+'</button>':'<span></span>')+'<div class="t">'+esc(titleOf(c))+'</div>'+'<span></span>';
 top.classList.toggle('sc',scrollY>50);navbg.classList.toggle('sc',scrollY>8);navbg.classList.toggle('tall',c.v==='persona');
}
function renderTab(){
 tabbar.style.setProperty('--n',TABS.length);
 tabbar.innerHTML='<div class="tb-ind" style="width:calc((100% - .5rem)/'+TABS.length+');transform:translateX('+TABS.findIndex(function(t){return t[0]===nav.tab})*100+'%)"></div>'+
  TABS.map(function(t){return '<button class="tab" data-do="tab" data-v="'+t[0]+'" aria-label="'+t[1]+'"'+(t[0]===nav.tab?' aria-current="page"':'')+'>'+svg(t[2])+'<span>'+t[1]+'</span></button>'}).join('');
}
function renderView(){
 var c=cur();
 root.innerHTML='<main class="view cur">'+viewHtml(c)+'</main>';
 renderTop();
}
var animUntil=0;
function go(kind,fn){ // kind: fwd|back|none
 var old=root.querySelector('.view');var snap=null;
 if(kind!=='none'&&old&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  snap=document.createElement('div');snap.className='pg pg-old';
  var inner=old.cloneNode(true);inner.classList.remove('cur');inner.removeAttribute('id');
  inner.querySelectorAll('[id]').forEach(function(e){e.removeAttribute('id')});inner.setAttribute('aria-hidden','true');
  inner.style.transform='translateY('+(-scrollY)+'px)';snap.appendChild(inner);
 }
 fn();
 if(snap){
  document.body.appendChild(snap);
  var h=document.documentElement;h.classList.add('pg-run','pg-'+kind);
  if(kind==='back')snap.style.pointerEvents='none';
  animUntil=Date.now()+460;
  setTimeout(function(){snap.remove();h.classList.remove('pg-run','pg-fwd','pg-back')},460);
 }
}
function setTab(t){
 nav.tab=t;nav.stack=[];nav.sec='Overview';renderTab();renderView();scrollTo(0,0);
}

/* ---------- toast ---------- */
var tt;function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('on')},1600)}
function copy(t){
 var done=function(){toast('Copied')};
 try{navigator.clipboard.writeText(t).then(done,function(){fallback(t);done()})}catch(e){fallback(t);done()}
}
function fallback(t){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0;font-size:16px';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-do]');if(!el)return;
 var d=el.dataset,a=d.do;
 if(Date.now()<animUntil&&(a==='open'||a==='back'))return;
 if(a==='tab'){
  tabbar.classList.remove('tap');void tabbar.offsetWidth;tabbar.classList.add('tap');setTimeout(function(){tabbar.classList.remove('tap')},650);
  if(d.v===nav.tab&&nav.stack.length===0){scrollTo({top:0,behavior:'smooth'});return}
  setTab(d.v);
 }else if(a==='open'){
  var vv=d.v==='plan'?'plan-page':d.v;
  go('fwd',function(){nav.stack.push({v:vv,id:d.id});nav.sec='Overview';renderView();scrollTo(0,0)});
 }else if(a==='back'){
  go('back',function(){nav.stack.pop();nav.sec='Overview';renderView();restore()});
 }else if(a==='filters'){openSheet();
 }else if(a==='fclose'){closeSheet();
 }else if(a==='freset'){S.f={niche:'all',mkt:'all',g:'all'};save();if(sheetEl){document.getElementById('sb').innerHTML=sheetBody()}refreshList();
 }else if(a==='fset'){S.f[d.k]=d.v;save();if(sheetEl){var sb=document.getElementById('sb'),st=sb.scrollTop;sb.innerHTML=sheetBody();sb.scrollTop=st}refreshList();
 }else if(a==='clear'){S.f[d.k]='all';save();refreshList();
 }else if(a==='sec'){
  nav.sec=d.v;var y2=scrollY;var pill=document.querySelector('.pills');var left=pill?pill.scrollLeft:0;renderView();var p2=document.querySelector('.pills');if(p2)p2.scrollLeft=left;scrollTo(0,Math.min(y2,200));
 }else if(a==='status'){
  S.st[d.id]=d.v;save();var y3=scrollY;renderView();scrollTo(0,y3);
 }else if(a==='ck'){
  var ck=S.ck[d.id]||[],i=+d.i,ix=ck.indexOf(i);if(ix>=0)ck.splice(ix,1);else ck.push(i);S.ck[d.id]=ck;save();var y4=scrollY;renderView();scrollTo(0,y4);
 }else if(a==='copy'){
  var t=copyStore[+d.i];if(t!=null)copy(t);
 }else if(a==='theme'){
  S.theme=d.v;save();applyTheme();var y5=scrollY;renderView();scrollTo(0,y5);
 }else if(a==='export'){
  var lines=[];D.personas.forEach(function(p){var s=pStatus(p.id),n=S.nt[p.id],ck=(S.ck[p.id]||[]).length;if(s!=='review'||n||ck)lines.push(p.name+' ('+NK[p.niche].name+', '+MK[p.mkt].name+', '+gtxt(p.g)+'): '+stText(s)+', checklist '+ck+'/'+p.check.length+(n?'. Notes: '+n:''))});
  copy(lines.length?lines.join('\n'):'No review notes yet.');
 }
});
document.addEventListener('input',function(e){
 if(e.target.id==='q'){nav.q=e.target.value;refreshList()}
 else if(e.target.id==='nt'){S.nt[e.target.dataset.id]=e.target.value;save()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
var lastY=0,ticking=false;
addEventListener('scroll',function(){
 if(ticking)return;ticking=true;
 requestAnimationFrame(function(){
  ticking=false;var y=scrollY;
  top.classList.toggle('sc',y>50);navbg.classList.toggle('sc',y>8);
  if(y>lastY+8&&y>12)tabbar.classList.add('min');else if(y<lastY-8||y<=12)tabbar.classList.remove('min');
  lastY=y;
 });
},{passive:true});
var saved={};
function restore(){}
addEventListener('popstate',function(){});
matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);

/* ---------- boot ---------- */
applyTheme();renderTab();renderView();
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
