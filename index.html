.chip::after{content:"";position:absolute;inset:-.1rem 0}

.tag.w1{background:rgba(52,199,89,.18);color:var(--green)}.tag.w2{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.tag.w3{background:rgba(255,149,0,.2);color:var(--orange)}.tag.w4{background:var(--fill)}
.tag.ok{background:rgba(52,199,89,.18);color:var(--green)}.tag.no{background:rgba(255,59,48,.16);color:var(--red)}.tag.verify{background:rgba(255,149,0,.2);color:var(--orange)}

ol.s>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:.7rem;width:1.8rem;height:1.8rem;border-radius:999px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:700;font-size:.9rem;display:grid;place-items:center}
ol.s .st{font-weight:600}ol.s .sd{color:var(--label2);font-size:.9375rem}
.note{background:rgba(255,149,0,.14);border-radius:1rem;padding:.8rem 1rem;margin:.6rem 0;font-size:.9375rem}

.btn{min-height:2.5rem;padding:.4rem 1rem;border-radius:999px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:600;font-size:.9375rem;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.8}.btn.sec{background:var(--fill);color:var(--acc)}
.btn.sm{min-height:2.25rem;padding:.25rem .8rem;font-size:.875rem}
.seg{display:flex;background:var(--fill);border-radius:.8rem;padding:.15rem;gap:.15rem;margin:.2rem 0 1rem}

.seg button[aria-pressed="true"]{background:var(--elev);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.box{width:1.5rem;height:1.5rem;border-radius:999px;border:2px solid var(--label3);flex:none;display:grid;place-items:center;margin-top:.1rem}
.check.on .box{background:var(--green);border-color:var(--green);color:#fff}.check.on .tx{color:var(--label2);text-decoration:line-through}
.box svg{width:.9rem;height:.9rem;opacity:0}.check.on .box svg{opacity:1}

.hero{border-radius:1.5rem;padding:1.2rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));margin:0 0 .9rem}

.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom)*0);width:min(calc(100% - 2rem),36rem);transform:translateX(-50%);
display:flex;height:3.5rem;padding:.25rem;border-radius:999px;background:var(--lg-tint);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 6px 20px var(--lg-sh);
transition:width .4s cubic-bezier(.3,1.25,.4,1),height .4s cubic-bezier(.3,1.25,.4,1)}

.tab svg{width:1.5rem;height:1.5rem;transition:width .3s,height .3s}

"ph":{"hello":["Hei","(hy)"],"thanks":["Takk","(tahk)"],"station":["Hvor er stasjonen?","(voor air stah-SHOON-en)"],"caption":["Hi","Thank you"]},"weather":"For outdoor shots add a warm coat and scarf.","hair":"long straight hair tucked behind one ear","outfit":"a smart-casual knit top and jeans","setting":"at a local café table with a notebook and a coffee","plan":false}],"plan":[{"id":"waves","title":"Launch plan: pilot first","sub":"Two personas, four weeks, then decide","icon":"flag","blocks":[["p","A 12 s talking video costs about 3,850 credits, so this plan starts small. Run a pilot with two personas, learn what works and what it costs, and only then add more."],["cards",[["Pilot · weeks 1 to 4","Hannah (Healthy food, English US) and Ethan (Coding and AI, English US). Each posts about 2 clips a week: 1 talking video and 1 cheap format. Record views, follows, link clicks and credits spent per clip."],["Wave 1 · only if the pilot works","The other healthy food, coding and design personas in English (US) and Portuguese (Portugal). Add 2 to 4 at a time, never all at once."],["Wave 2","Gadgets, Home finds and Language learning in the languages that worked."],["Wave 3","One betting persona only after a legal check in an allowed market, and only with real bets and real results."],["Wave 4","The remaining languages. Nordic ones last because voice quality is untested and they need native review."]]],["p","Every Pilot, Wave 1 and Wave 2 persona in English (US) and Portuguese (Portugal) has a full four-week plan on its own page, under Content plan: 12 reels, 6 photos and 8 story sets with hooks, beats, scripts and captions. The other personas get theirs when their wave starts."],["h","Move on when"],["list",["After about 8 clips a persona, you can see which hooks and formats get views, and what each clip cost in credits.","Keep a persona if people follow and click. Change the angle before you spend more on it.","Do not judge in 7 days: the 7-day challenge account that was written off later had a video pass 250,000 views."]],["h","Credits and cost"],["p","The full price list, plan comparison and monthly budgets are on the next page: Credits and cost."],["note","Later languages to consider (general knowledge, not researched): Swedish, Dutch, Polish, Hindi and Indian English, Indonesian, Turkish, Arabic."]]},{"id":"cost","title":"Credits and cost","sub":"What each piece costs, which plan, monthly budgets","icon":"bolt","blocks":[["p","Numbers come from the first tutorial (screens shown in Oct 2026) and the OpenArt plan page (6 Nov 2026). They change, so trust the Generate button on your own screen. Figures marked \"estimate\" are my arithmetic, not shown on screen."],["h","What each thing costs"],["cards",[["Talking video · 3,850 credits","Seedance 2.5, 9:16, 1080p, 12 seconds, audio on. The voice is made inside the video, so there is no separate voice fee per clip. A 15 s video is about 4,800 (estimate)."],["Photo · 245 credits","GPT Image 2.5, 4K, quality High. The character sheet is one such generation. Lower resolution or a lighter model should cost less; check the button."],["Character · no price shown","Creating and saving the character did not show a credit price. You are limited by the number of character slots in your plan."],["Voice · 250 credits, once","Designing a voice costs 1 credit per preview. Saving it costs 250 once, and it can be reused for other characters without paying again."],["Cheaper video settings","The model list shows Seedance 2.5 Draft at 480p (can be upgraded to 1080p within 7 days), 720p and 480p options, and Kling 4.0 marked 50% off. Their exact prices were not shown."]]],["h","Plans"],["cards",[["Starter · $14 a month ($13 annual)","4,000 credits: about 1 talking video a month. Commercial use rights are not listed on this plan, so skip it for a monetized account. 13 characters."],["Plus · $34 ($27 annual)","12,000 credits: about 3 talking videos a month. Commercial use rights. 40 characters. Credits can be added as needed."],["Pro · $56 ($44 annual)","24,000 credits: about 6 talking videos a month. 80 characters, 32 parallel generations. Kling 4.0 50% off and GPT Image 2.6 30% off."],["Wonder · $240 ($175 annual)","106,000 credits: about 27 talking videos a month. 353 characters, priority support, and \"Unlimited Creation\" (check which models it covers before counting on it)."]]],["h","Cost of one 12 s talking video (estimate)"],["list",["Starter: about $13.50 monthly, $12.50 annual.","Plus: about $10.90 monthly, $8.70 annual.","Pro: about $9.00 monthly, $7.10 annual.","Wonder: about $8.70 monthly, $6.40 annual.","Expect at least one retry per clip, so double these for real planning."]],["h","Budgets"],["cards",[["Setting up one persona","About 2,000 to 2,500 credits (estimate): character sheet, three photos with a few retries, and the 250 voice fee. Roughly $5 to $6 on Pro."],["Pilot: 2 personas, 4 weeks","Per persona per week: 1 talking video (3,850) and 1 cheap format (a photo with voiceover, about 250 to 750). About 17 talking videos and 17 cheap posts in the month would be about 65,000 credits without retries, or about 130,000 with them. Start with Wonder or Pro plus added credits, and cut to 1 talking video a week if the budget runs out."],["Wave 1: 12 personas","At 3 talking videos a week each this is about 600,000 credits a month, nearly six Wonder plans. Not realistic. Add personas only as the budget and the results allow."]]],["h","Ways to spend less"],["list",["Preview in Draft 480p and upgrade only the winners within 7 days.","Use 6 second clips when a short line is enough: cost grows with length (estimate).","Mix formats: a photo with a slow push-in and a voiceover costs a fraction of a talking video.","Use 1K or 2K photos for references and 4K only for the final.","Try Kling 4.0 on Pro or Wonder while it is 50% off.","Make one video and post it on TikTok, Instagram and YouTube Shorts with three different captions.","Set a credit cap per persona per week and write down what each clip cost."]],["h","Before you subscribe"],["steps",[["1. Read the real prices","In OpenArt, open each video and image setting you plan to use and note the number on the Generate button: 480p, 720p, 1080p, 6 s and 12 s, Draft, and Kling."],["2. Check the terms","Read the commercial-use terms and what Unlimited Creation includes."],["3. Start one month","Pick the smallest plan that covers the pilot, not the biggest. Switch only after you have measured real credits per clip."]]]]},{"id":"stages","title":"Build a persona, step by step","sub":"Stages 1 to 7 with prompts","icon":"steps","blocks":[["p","The same seven stages for every persona. Each persona page has its own filled-in prompts. Settings come from the tutorial (Oct 2026); if your screen differs, trust the screen."],["steps",[["1. Design the character and first photo","In OpenArt: Image, GPT Image 2.5 (Sunburst for quality, Flare for speed), Auto Polish off, 4:5, 4K, quality High. Paste the photo prompt. The result should look like a casual phone photo, not a studio shoot."],["2. Name","One word, no spaces, no accents, easy to type. It becomes the @Name tag."],["3. Voice and backstory","Design a voice (Clone needs a recording). Test it on an ordinary sentence in the persona's language. Backstory: 3 to 4 sentences, no looks, clothes or places, or the character gets locked to one outfit or location."],["4. Create the character","Character, Create character, Start from an image, add the photo and name, add the voice, paste the backstory, Create."],["5. Character sheet","Three panels on gray: headless front, rear, face close-up. Then Character, Browse library, gear icon, Add additional angles."],["6. Photo set","Character image with @Name; three everyday moments in different places and clearly different outfits. Describe the outfit in full every time."],["7. Videos","Character video: Seedance 2.5, 9:16, 1080p, 12 s (15 s for explainers), audio on. Add the matching photo as @image1 to keep place and outfit. Run the hook step and the phonetic step first."]]],["h","Common problems"],["list",["Saved outfit or tote bag returns: the prompt lacked a full outfit description.","A different person appears: character not saved, or @Name missing.","Face not recognised: add a character sheet with a clear face close-up.","Stuck in one outfit or place: the backstory mentioned clothes or places.","Video changes place or outfit: add the matching photo as a second reference.","Voice sounds like an ad: ask for casual, unpolished wording and test an ordinary sentence.","A brand is mispronounced: redo the phonetic step.","Speech sounds translated: rewrite natively and get a native speaker to check."]]]},{"id":"hooks","title":"Hooks and stop-scroll","sub":"The first 3 seconds of every video","icon":"hook","blocks":[["p","Based on common creator guides, not platform-confirmed rules. For every video Claude writes three hook variants in the persona's native register; you pick one. Viewers decide to swipe within about 3 seconds."],["h","Structure of each clip (15 to 45 seconds)"],["steps",[["Hook · 0 to 3 s","One sentence or image that makes the next second necessary."],["Bridge · 3 to 8 s","Promise what is coming and why it matters, without giving it away."],["Payoff","The recipe, build, redesign, test or lesson. Show the result."],["Soft close and loop","One low-pressure line; cut the end so it flows back into the first frame."]]],["h","Hook types to rotate"],["cards",[["Curiosity gap","State the result, hide the method."],["Contrarian","Challenge a common belief."],["Specific number","\"Four ingredients, nine minutes, 410 kcal.\""],["Mistake or warning","Name a costly error."],["Before and after","Show the end state first."],["Direct call-out","\"If you can't cook, watch this.\""],["Open loop","Start mid-story."],["Pattern interrupt","Sudden close-up or sound change."]]],["h","Stop-scroll techniques (use at least two)"],["list",["Visual: open on motion or a striking close-up; no logo, no slow fade-in, no \"hi guys\"; the result in the first second; eye contact.","Text: large, bold, high-contrast hook text in frame one, in the persona's language, inside the safe area; burned-in captions for the whole clip.","Audio: spoken hook in the first second, a sound change near 3 s, a trending sound where supported.","Pacing: a cut, zoom or new angle every 2 to 4 seconds; no dead air."]],["h","Measure"],["list",["Share still watching at 3 seconds","Average watch time as a percent of length","Saves, shares and link clicks"]],["note","If viewers leave before 3 seconds, change the hook, not the video. Test three hook variants. Never use a hook translated from English: write it as a native creator would say it."]]},{"id":"sell","title":"Selling without selling","sub":"Create desire without sounding like an ad","icon":"tag","blocks":[["p","Each video gives something useful first. The offer appears as the natural next step. The viewer should want the next thing, not be told to buy."],["h","Rotate three post types"],["cards",[["Value-first · about 60%","Useful tip, recipe, build, lesson or result. No offer, or only \"more in my profile\"."],["Story · about 25%","A problem and how it was solved, with the product inside the story."],["Soft call to action · about 15%","The product in use plus one calm line."]]],["note","The 60/25/15 split is a starting suggestion; the sources give no fixed ratio. Test it."],["h","Techniques"],["list",["Show, don't pitch: demonstrate the plan, app or before and after in use.","Normalize the mention: the offer is part of the routine.","Create the need first: make the viewer's problem vivid, then show the way out.","Answer the unspoken doubt: \"does it work for a beginner?\"","Open loops across a series: end Part 1 with the question Part 2 answers.","Real proof only: real screenshots, real results, honest limits."]],["h","Soft call-to-action lines"],["list",["\"The full plan is in my bio if you want it, no pressure.\"","\"I put the whole thing in one file, link's in my profile.\"","\"Part 2 tomorrow.\""]],["note","Avoid \"Limited time only!\" and \"Don't miss out!\" Disclose affiliate or paid content in the video and the description."]]},{"id":"desc","title":"Descriptions per platform","sub":"TikTok, Instagram Reels, YouTube Shorts","icon":"text","blocks":[["p","Claude writes all three for every video, three versions each, in the persona's language. Each persona page has an English draft for clip 1 and a ready-to-copy request for Claude."],["cards",[["TikTok","Best length 15 to 60 s. First line: the hook plus the main keyword. 1 to 3 short lines and a question to trigger comments. 4 to 7 hashtags: 3 to 5 trending and relevant plus 1 or 2 niche. Use TikTok's AI-generated content label and \"AI creator\" in the profile."],["Instagram Reels","Best length 15 to 90 s. The hook goes before the \"more\" cut. 2 to 4 short lines with line breaks; a story or a save-worthy list. 5 to 10 niche hashtags at the end or in the first comment. Use the AI label setting and the Paid partnership label when it applies."],["YouTube Shorts","Under 60 s (up to 3 min). Searchable title with the main keyword; no hashtags in the title. Description 100 to 300 words, keywords used naturally, chapters if over 60 s. 3 to 5 hashtags including #Shorts. Turn on the altered or synthetic content disclosure; mention affiliate links."]]],["h","Rhythm and file"],["list",["From one guide (verify): TikTok and Reels 5 to 7 per week, Shorts 1 to 2 per day.","Upload the original full-resolution file, not a screen recording.","Keep key elements centred; Reels crop to 4:5 in the feed."]],["h","Worked example · Healthy food, English (US)"],["prompt","TikTok","Seven dinners under 450 kcal and I only shopped once. Which day would you cook first? Part 2 tomorrow. Plan is in my profile. #mealprep #healthyrecipes #caloriedeficit #easydinner #aiinfluencer"],["prompt","Instagram","Dinner used to be my biggest calorie trap. So I planned the whole week in one shop: seven meals, every one under 450 kcal. Save this for your next grocery run. The full plan is linked in my profile. (I'm an AI creator.) #mealprep #healthyrecipes #easydinners #caloriedeficit"],["prompt","YouTube Shorts title and description","7 dinners under 450 kcal (one grocery trip)\n\nSeven simple dinners, each under 450 kcal, from one grocery trip. In this Short: the shopping list, the portions and the swap that cut the most calories. The complete printable week plan is linked below. I'm an AI creator; the link is a product link where stated. #Shorts #mealprep #healthyrecipes #caloriedeficit"]]},{"id":"nat","title":"Naturality standard","sub":"Looks, movement, speech","icon":"eye","blocks":[["p","Spotless means the same believable face every time, motion a viewer does not question, and speech a native speaker accepts as their own. Run this on every clip."],["h","Look"],["list",["Real imperfections (skin texture, freckles, flyaway hair), no beauty-filter gloss, Auto Polish off.","Phone-camera feel: candid framing, slight tilt, natural noise.","Local details that match the market: language on signs, plugs, cars, clothes for the weather, plausible local cafes and kitchens.","A full outfit description in every prompt."]],["h","Movement"],["list",["Clips of 12 seconds or less, one action each, handheld or selfie style, at most one camera move.","Ask for the action second by second.","Check hands and fingers, blinking, eye line, teeth, jewellery flicker, background text, extra people, outfit continuity and audio glitches. Regenerate rather than fix."]],["h","Speech"],["list",["One or two short sentences per 12-second clip, written the way people talk, not the way ads read.","Use the filler words and rhythm of the language, and have a native speaker confirm them.","Use the register a creator would use on camera, not textbook speech."]],["note","Before scaling any persona: make three sample clips, have a native speaker watch them with the sound on, save the persona bible, and re-check the pronunciation of every brand and foreign name. The tutorial only showed English; native voice quality in other languages is untested."]]},{"id":"brand","title":"Brands and phonetic spelling","sub":"Always ask before writing the final line","icon":"mic","blocks":[["p","Voice models mispronounce brand names, app names, acronyms and foreign words. Whenever a script names one, Claude stops and asks you how it should sound."],["steps",[["List every risky word","Brands, product and app names, people's names, acronyms, URLs, prices and numbers."],["Ask one question per word","\"How should [brand] sound when [persona] says it in [language]?\" Claude may suggest a spelling; you confirm it, because only a native speaker knows the local sound."],["Write the line with the confirmed spelling","Keep the correct spelling in the on-screen text or caption."],["Listen and fix","Report any word that still sounds wrong; regenerate only that clip."],["Keep a glossary per persona","Reuse it in later scripts."]]],["list",["Write numbers and prices out in words in the spoken line.","Do not read web addresses aloud: say \"link in bio\" and show it on screen.","Show a real product only when the team bought and filmed it; otherwise plain unbranded props.","In language-learning episodes, give each new word a phonetic spelling too."]]]},{"id":"rules","title":"Rules and risks","sub":"Checked 5 Nov 2026 · not legal advice","icon":"shield","blocks":[["note","These come from web sources, not lawyers. Verify locally before launch."],["h","AI labelling and sponsored content"],["cards",[["United States","FTC endorsement guides cover virtual influencers. Paid or affiliate links need a clear disclosure, and the source advises also saying the influencer is virtual, inside the video."],["European Union","AI Act Article 50 applies from 2 August 2026. Tool providers must mark AI output in machine-readable form; people making deepfakes must disclose it. Tools already on the market get until 2 December 2026 for the marking duty. Whether a fully invented person counts as a deepfake was not settled in the source, so label anyway."],["France","France: the 2023 influencer law requires \"Publicité\" or \"Collaboration commerciale\" on sponsored posts and \"Image virtuelle\" on AI-generated posts. Influencers and advertisers share liability, and influencers answer for dropshipped products."],["UK, Norway, Brazil, Latin America","Not researched. Label the persona as AI and check the local advertising rules."]]],["h","Sports betting promotion by market"],["cards",[["English (US)","US betting promotion is state by state and was not verified. Check each state and get legal advice before any betting persona. Show 21+ and a responsible-gambling message."],["English (UK)","UK: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Spanish (Latin America)","Latin American betting promotion varies by country and was not verified. Pick one country and check its regulator before any betting persona."],["Portuguese (Brazil)","Brazil regulates betting and its advertising, but this was not verified here. Check the current rules with a lawyer before any betting persona."],["Portuguese (Portugal)","Portuguese betting promotion rules were not verified. Check the regulator (SRIJ) and get legal advice before any betting persona."],["French","France: since the law of 9 June 2023 influencers may not promote paid sports-tip subscriptions, and tip services cannot be presented as improving the chance of winning. No betting persona in France."],["Italian","Italy: near-total ban; influencer ads and affiliate marketing for betting are prohibited. No betting persona in Italy."],["German","Germany: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Finnish","Finland: state gambling monopoly; promoting other operators is illegal marketing, and a new law from 1 July 2027 effectively bans influencers from distributing even licensed operators' marketing. No betting persona."],["Danish","Denmark: affiliates can generally promote locally licensed brands under strict content, timing and placement rules. Verify the current rules before launch."],["Norwegian","Norway: promotion is limited to the two monopoly operators; helping market sites licensed elsewhere is illegal. No betting persona."]]],["h","Content rules wherever betting is used"],["list",["Real account, real bets, real outcomes including losses.","No claims that tips improve the chance of winning or guarantee profit.","Show the age limit and a responsible-gambling message.","Check the app and its promotion are legal in that market.","Disclose the affiliate link and that the persona is AI."]],["h","Other"],["list",["Healthy food: kcal and portions as information, no extreme diets or medical promises.","Never base a persona on a real person's face or voice.","Check OpenArt's terms on commercial use of outputs and saved characters.","Check tax or business registration where you live."]]]},{"id":"teaser","title":"Adult-adjacent persona (women only)","sub":"What is possible and what is not","icon":"lock","blocks":[["p","You asked for a women-only persona with more natural, more erotic videos to send visitors to a subscription page. I can help build a suggestive-but-not-explicit teaser persona. I will not write or plan explicit sexual content."],["h","Where the subscription page can live"],["cards",[["OnlyFans","One third-party source (checked 5 Nov 2026) reports that the October 2026 Terms require AI content to clearly feature the verified creator and prohibit wholly AI-generated accounts. A fully invented persona is likely not allowed. Verify with OnlyFans' own terms or support."],["Fanvue","Its help page says fully AI virtual characters are allowed if you pass ID verification, label the account clearly as AI, never tell fans she is real, and the character looks clearly adult. It must not resemble a real identifiable person without documented consent. Verify the current wording."]]],["h","Where teasers can be posted"],["list",["TikTok bans content promoting sexual solicitation, including premium sexual content. A 2021 report said linking an OnlyFans from a profile got accounts banned; policies may have changed.","Instagram and YouTube restrict sexually suggestive content, nudity and adult-service promotion.","On those three platforms the persona stays lifestyle-level and does not mention, link or hint at an adult page where the rules forbid it.","No coded wording, hidden links or other ways around moderation."]],["h","The persona"],["list",["Clearly an adult woman (25 or older in appearance), an invented face, no real person's likeness.","Warm, confident, flirty personality; everyday settings; natural movement and speech.","Clearly labelled as AI in the bio and with each platform's AI label.","Suggestive means styling, framing and personality at roughly PG-13 level."]],["h","Keep out"],["list",["Anything that could read as a minor.","Deepfakes or content from other people's photos.","Claims she is a real woman, or fake private messages.","Explicit content: I will not write it, and image tools usually restrict it."]],["note","Launch after Wave 1, once lifestyle content shows an audience, and only after reading the current rules of the subscription site and each posting platform."]]},{"id":"caveats","title":"Honest expectations","sub":"What the tutorials really showed","icon":"scale","blocks":[["list",["The only real-money result: 23 workbook sales at $12 = $276 revenue, minus $19.52 payment fees and a $99 tool plan = $157.48 profit in a week, short of the author's $1,000 goal.","Both tutorials carry affiliate links and one is sponsored. Results shown are curated; real work includes retries and wasted credits.","Label every account as AI. Do not present generated people, testimonials or sponsored content as a real person's genuine experience.","Not covered by the tutorials: OpenArt's commercial terms, each platform's current rules for AI accounts, and tax rules."]],["h","Strategy from the 7-day challenge"],["list",["Research first: study existing AI accounts and how they earn.","Make the character distinctive, not generic.","Test several accounts, about 10 videos each, and compare.","Ways to earn: brand deals (slow), physical products, affiliate (quick), digital products (a structured workbook sold for $12 and linked from the bio).","Use the persona to gain attention, then put one offer in front of that audience through the bio link."]]]},{"id":"week","title":"First-week plan","sub":"Five steps to start","icon":"calendar","blocks":[["steps",[["1. Check credits and terms","Read the Credits and cost page, check the Generate prices on your screen, and pick a pilot persona and a distinctive character concept."],["2. Build the character","Stages 1 to 5. Save the persona bible."],["3. Make content","Three photos, one talking video from a photo, one selfie video. Run the hook step, the naturality checklist and the phonetic step. Write the three platform descriptions."],["4. Create the account","AI label and a clear bio. Post 2 to 4 clips over the week, with captions, mixing one talking video and cheaper formats."],["5. Review","After a week, note which hooks and video types got views. Only then choose how the persona earns."]]]]}],"epis":[["Season 1: Basics",["Hello and goodbye","Please, thank you, sorry","Yes, no, I do not understand","Introduce yourself","Numbers 1 to 10","Order a coffee","How much is it?","Where is the station?","Asking for help","Recap and quiz"]],["Season 2: Eating and shopping",["Menu words","Allergies and preferences","Order dinner","Pay the bill","At the market","Sizes and colours","Asking for a discount","Complimenting the food","Small talk about the weather","Recap and quiz"]],["Season 3: Getting around",["Train tickets","Taxi and ride-hailing","Directions","Hotel check-in","Time and dates","Emergencies","Making plans","Texting slang","A mini conversation","Finale quiz"]]],"bank":{"food":{"reels":[{"t":"One pan, 400 kcal","k":"Recipe, voiceover and hands","tech":"Number in the first second","h":{"en":"Four ingredients, nine minutes, 410 kcal.","pt":"Quatro ingredientes, nove minutos, 410 kcal."},"sh":{"en":["0-2s: Finished bowl in the first frame, kcal number on top. Slow push-in.","2-8s: Overhead of one pan: chicken, black beans, rice, salsa going in. Hands only.","8-12s: {name} at the counter, holds up the bowl, small smile."],"pt":["0-2s: Prato pronto logo no primeiro frame, kcal em cima. Aproximação lenta.","2-8s: Plano de cima de uma frigideira: bacalhau, grão, espinafres. So as mãos.","8-12s: {name} na bancada, mostra o prato, sorriso pequeno."]},"ot":{"en":["410 kcal","9 minutes","1 pan"],"pt":["410 kcal","9 minutos","1 frigideira"]},"s":{"en":"Four ingredients, one pan, nine minutes. Chicken, black beans, rice and salsa: about 410 kcal and 38 grams of protein. I weigh the rice, that is the only fussy bit. Full plan is in my bio.","pt":"Quatro ingredientes, uma frigideira, nove minutos. Bacalhau, grão, espinafres e um fio de azeite: cerca de 410 kcal. Peso o grão, é a única parte chata. O plano completo está na bio."},"te":"Show a full recipe in 12 seconds with the kcal and the time as proof. The viewer should be able to cook it from the clip alone.","se":{"en":"If you want the whole week like this, the 7-day plan is in my bio, no pressure.","pt":"Se quiseres a semana toda assim, o plano de 7 dias está na bio, sem pressão."}},{"t":"3 swaps that cut 300 kcal","k":"Swap list, split screen","tech":"Contrarian claim plus list","h":{"en":"You do not need to eat less. You need to swap three things.","pt":"Não precisas de comer menos. Precisas de trocar três coisas."},"sh":{"en":["0-3s: {name} points at the screen. Two plates side by side, kcal on each.","3-9s: Three quick swaps appear as cards, each with kcal saved. Hand slides each card in.","9-12s: Total saved on screen, {name} nods."],"pt":["0-3s: {name} aponta para o ecrã. Dois pratos lado a lado com kcal.","3-9s: Três trocas em cartões, cada uma com kcal poupadas.","9-12s: Total poupado no ecrã, {name} acena."]},"ot":{"en":["-300 kcal","Swap 1: mayo to Greek yogurt","Swap 2: soda to sparkling water","Swap 3: chips to popcorn"],"pt":["-300 kcal","Troca 1: maionese por iogurte grego","Troca 2: refrigerante por água com gás","Troca 3: batatas fritas por pipocas"]},"s":{"en":"Three swaps, 300 kcal gone, and you still feel full. Mayo for Greek yogurt, soda for sparkling water, chips for popcorn. Not a diet, just three tiny changes. Which one would you try first?","pt":"Três trocas, 300 kcal a menos, e continuas com a barriga cheia. Maionese por iogurte grego, refrigerante por água com gás, batatas fritas por pipocas. Não é dieta, são três mudanças pequenas. Qual experimentavas primeiro?"},"te":"One idea per swap: same food feeling, fewer kcal. Numbers must match a real label or app.","se":{"en":"I put all my swaps in one page, it is in my bio if you want it.","pt":"Juntei as minhas trocas numa página, está na bio se quiseres."}},{"t":"Sunday prep: 5 lunches in 40 minutes","k":"Time-lapse, voiceover","tech":"Open loop with a time limit","h":{"en":"Five lunches in forty minutes. Watch the clock.","pt":"Cinco almoços em quarenta minutos. Vê o relógio."},"sh":{"en":["0-3s: Timer 40:00 in the corner, empty counter, five containers.","3-9s: Time-lapse: chop, cook, portion. Timer runs down.","9-12s: Five full containers lined up, timer at 0:00."],"pt":["0-3s: Cronómetro 40:00 no canto, bancada vazia, cinco caixas.","3-9s: Time-lapse: cortar, cozinhar, porcionar. O cronómetro desce.","9-12s: Cinco caixas cheias, cronómetro a 0:00."]},"ot":{"en":["5 lunches","40 minutes","~480 kcal each"],"pt":["5 almoços","40 minutos","~480 kcal cada"]},"s":{"en":"Sunday, forty minutes, five lunches. One tray of chicken and veg, one pot of rice, five boxes. About 480 kcal each. Monday me says thank you every single week.","pt":"Domingo, quarenta minutos, cinco almoços. Um tabuleiro de frango e legumes, um tacho de arroz, cinco caixas. Cerca de 480 kcal cada. A minha versão de segunda-feira agradece todas as semanas."},"te":"Batch cooking in order: what goes in the oven first, what to cook while it bakes, how to portion.","se":{"en":"The shopping list for this one is in my bio.","pt":"A lista de compras desta está na bio."}},{"t":"What 500 kcal looks like, three ways","k":"Visual comparison","tech":"Visual surprise","h":{"en":"Same 500 kcal. Look how different the plate is.","pt":"As mesmas 500 kcal. Vê como o prato é diferente."},"sh":{"en":["0-3s: Three plates on a table, big number 500 kcal over all of them.","3-9s: Camera pans left to right: a small pastry, a big salad bowl with chicken, a full dinner plate.","9-12s: {name} looks at the camera: which one fills you up?"],"pt":["0-3s: Três pratos numa mesa, número grande 500 kcal por cima.","3-9s: A câmara desliza da esquerda para a direita: um pastel pequeno, uma tigela grande de salada com frango, um prato de jantar completo.","9-12s: {name} olha para a câmara: qual te sacia mais?"]},"ot":{"en":["500 kcal","A","B","C"],"pt":["500 kcal","A","B","C"]},"s":{"en":"Five hundred calories. A pastry, a big chicken salad, or a full dinner. Same number, very different afternoon. Food volume is the trick: more food, same calories. Pick one in the comments.","pt":"Quinhentas calorias. Um pastel de nata, uma tigela grande de salada com frango, ou um jantar completo. O mesmo número, uma tarde muito diferente. O truque é o volume: mais comida, as mesmas calorias. Escolhe uma nos comentários."},"te":"Calorie density in one picture: why volume and protein change how full you feel.","se":null},{"t":"One grocery list, a whole week","k":"Grocery list, price on screen","tech":"Specific cost promise","h":{"en":"A whole week of dinners for sixty dollars. Here is the list.","pt":"Uma semana inteira de jantares por quarenta euros. Aqui está a lista."},"sh":{"en":["0-3s: Shopping cart or basket, total price big on screen.","3-9s: Items drop into the frame one by one, each with its price.","9-12s: Receipt pinned to the fridge, {name} taps it."],"pt":["0-3s: Cesto de compras, preço total grande no ecrã.","3-9s: Os produtos entram um a um no ecrã, cada um com o preço.","9-12s: Talão colado no frigorífico, {name} toca nele."]},"ot":{"en":["7 dinners","$60 total","~450 kcal each"],"pt":["7 jantares","40 € no total","~450 kcal cada"]},"s":{"en":"Seven dinners for sixty dollars. Chicken thighs, rice, beans, frozen veg, eggs, oats. Nothing fancy. Prices change, so adjust. The meals are all around 450 kcal. Save this for the shop.","pt":"Sete jantares por quarenta euros. Coxas de frango, arroz, feijão, legumes congelados, ovos, aveia. Nada de especial. Os preços mudam, ajusta. As refeições têm cerca de 450 kcal. Guarda para ires às compras."},"te":"A real weekly basket with real prices from a store near {city}. Check prices the day you film.","se":{"en":"The week of meals that uses this list is in my bio.","pt":"A semana de refeições que usa esta lista está na bio."}},{"t":"Takeaway vs the home version","k":"Side by side","tech":"Before vs after","h":{"en":"This delivery order is 1,100 kcal. The home version is 520.","pt":"Esta encomenda de takeaway tem 1.100 kcal. A versão caseira tem 520."},"sh":{"en":["0-3s: Delivery bag next to the home plate, both kcal on screen.","3-9s: Close-up of each, {name} points at the difference in oil and portion.","9-12s: Wipe transition to the cost: $18 vs $5."],"pt":["0-3s: Saco de takeaway ao lado do prato caseiro, kcal de ambos no ecrã.","3-9s: Plano aproximado de cada um, {name} mostra a diferença no óleo e na dose.","9-12s: Transição para o preço: 14 € vs 4 €."]},"ot":{"en":["1,100 kcal vs 520","$18 vs $5"],"pt":["1.100 kcal vs 520","14 € vs 4 €"]},"s":{"en":"Same craving, two versions. The takeaway is eleven hundred calories and eighteen dollars. Mine is five twenty and five dollars, and it takes twenty minutes. Takeaway is not the enemy, it is just a lot.","pt":"A mesma vontade, duas versões. O takeaway tem mil e cem calorias e custa catorze euros. O meu tem quinhentas e vinte e custa quatro, e leva vinte minutos. O takeaway não é o inimigo, é só muito."},"te":"Compare a typical order with a home version using the restaurant menu kcal where it is published.","se":null},{"t":"A breakfast under 300 kcal that keeps you full","k":"Recipe, close-ups","tech":"Question as the hook","h":{"en":"Why are you hungry again at ten?","pt":"Porque é que já tens fome às dez?"},"sh":{"en":["0-3s: {name} at the counter, hand on stomach, slight frown.","3-9s: Close-ups: Greek yogurt, berries, oats, chia into a glass.","9-12s: Finished glass, kcal and protein on screen."],"pt":["0-3s: {name} na bancada, mão na barriga, sobrolho franzido.","3-9s: Planos aproximados: iogurte grego, frutos vermelhos, aveia, chia num copo.","9-12s: Copo pronto, kcal e proteína no ecrã."]},"ot":{"en":["285 kcal","24 g protein"],"pt":["285 kcal","24 g de proteína"]},"s":{"en":"Hungry again at ten? Protein is the fix. Greek yogurt, berries, oats and chia: two eighty-five calories and twenty-four grams of protein. Make it the night before and it is breakfast in ten seconds.","pt":"Já com fome às dez? A proteína resolve. Iogurte grego, frutos vermelhos, aveia e chia: duzentas e oitenta e cinco calorias e vinte e quatro gramas de proteína. Faz na véspera e o pequeno-almoço fica pronto em dez segundos."},"te":"Protein plus fibre as the reason a light breakfast still fills you up. No medical claims.","se":{"en":"More breakfasts like this are in the plan in my bio.","pt":"Mais pequenos-almoços assim estão no plano na bio."}},{"t":"The mistake that makes meal prep boring","k":"Talking head with B-roll","tech":"Mistake reveal","h":{"en":"This is why manal real: entrada e saída.","9-12s: Antes e depois lado a lado."]},"ot":{"en":["1 hour saved weekly","Before / After"],"pt":["1 hora poupada por semana","Antes / Depois"]},"s":{"en":"Every Friday I used to spend an hour on the weekly report. Now I paste the week in, the skill writes it, I read it for two minutes. Here is the full setup, start to finish.","pt":"Todas as sextas gastava uma hora no relatório semanal. Agora colo a semana, a skill escreve, e eu leio durante dois minutos. Aqui está a configuração completa, do início ao fim."},"te":"A Claude skill or workflow shown end to end on a real task.","se":{"en":"The template is in my bio.","pt":"O template está na bio."}},{"t":"What is an API? In plain words","k":"Whiteboard explainer","tech":"Plain-words promise","h":{"en":"Ten seconds. What an API is. No jargon.","pt":"Dez segundos. O que é uma API. Sem jargão."},"sh":{"en":["0-3s: {name} next to a drawn restaurant: customer, waiter, kitchen.","3-9s: Arrows show request and answer, labels API.","9-12s: {name} points at \"waiter = API\"."],"pt":["0-3s: {name} ao lado de um restaurante desenhado: cliente, empregado, cozinha.","3-9s: Setas mostram pedido e resposta, etiqueta API.","9-12s: {name} aponta para \"empregado = API\"."]},"ot":{"en":["API = the waiter","You ask, it brings"],"pt":["API = o empregado","Tu pedes, ele traz"]},"s":{"en":"An API is a waiter. You do not walk into the kitchen. You tell the waiter what you want, the kitchen makes it, the waiter brings it back. That is all. Next: what a key is.","pt":"Uma API é um empregado de mesa. Tu não entras na cozinha. Dizes ao empregado o que queres, a cozinha faz, o empregado traz. É só isso. A seguir: o que é uma chave."},"te":"Translate one concept into plain words with one analogy.","se":null},{"t":"The prompt mistake","k":"Talking head, screen insert","tech":"Mistake reveal","h":{"en":"Your AI answers are vague for one reason.","pt":"As respostas da tua IA são vagas por uma razão."},"sh":{"en":["0-3s: {name} to camera, serious.","3-9s: Screen: vague prompt, vague answer, then add context, better answer.","9-12s: Two answers side by side."],"pt":["0-3s: {name} para a câmara, com ar sério.","3-9s: Ecrã: prompt vago, resposta vaga, depois com contexto, resposta melhor.","9-12s: Duas respostas lado a lado."]},"ot":{"en":["Mistake: no context","Add who, what, format"],"pt":["Erro: sem contexto","Junta quem, o quê, formato"]},"s":{"en":"Vague prompt, vague answer. Add three things: who it is for, what you want, and what format. Same model, much better answer. Try it on your last prompt right now.","pt":"Prompt vago, resposta vaga. Junta três coisas: para quem é, o que queres e em que formato. O mesmo modelo, uma resposta muito melhor. Experimenta no teu último prompt agora."},"te":"Before vs after of a prompt, shown with the real model output.","se":null},{"t":"Build in parts: add the feature","k":"Screen recording, part 2","tech":"Series continuation","h":{"en":"Yesterday it only showed a list. Now watch what I add.","pt":"Ontem só mostrava uma lista. Agora vê o que acrescento."},"sh":{"en":["0-3s: Recap frame, then yesterday's screen.","3-9s: New prompt, new feature appears on screen.","9-12s: Test passes, small celebration."],"pt":["0-3s: Resumo, depois o ecrã de ontem.","3-9s: Novo prompt, a nova função aparece no ecrã.","9-12s: Teste passa, pequena celebração."]},"ot":{"en":["Part 2 of 3","New feature"],"pt":["Parte 2 de 3","Nova função"]},"s":{"en":"Part two. Yesterday it only showed a list. I ask for a search box, it writes it, I test it. Works. One more part and it goes live. Follow so you do not miss it.","pt":"Parte dois. Ontem só mostrava uma lista. Peço uma caixa de pesquisa, ele escreve, eu testo. Funciona. Mais uma parte e fica online. Segue para não perderes."},"te":"Keep each part to one change and end on an open question.","se":null},{"t":"Build in parts: go live","k":"Screen recording, deploy","tech":"Payoff","h":{"en":"It is live. Here is the link. Break it if you can.","pt":"Está online. Aqui está o link. Tenta estragá-lo."},"sh":{"en":["0-3s: Browser, live URL, {name} types it in.","3-9s: Open on a phone, use the app, it works.","9-12s: {name} challenges viewers to try it."],"pt":["0-3s: Navegador, URL online, {name} escreve-o.","3-9s: Abre no telemóvel, usa a aplicação, funciona.","9-12s: {name} desafia quem vê a experimentar."]},"ot":{"en":["Live","Try it"],"pt":["Online","Experimenta"]},"s":{"en":"It is live. From an empty folder to a link anyone can open, in one weekend. Try it on your phone and tell me what breaks. I read every comment.","pt":"Está online. De uma pasta vazia a um link que qualquer pessoa abre, num fim de semana. Experimenta no telemóvel e diz-me o que falha. Leio todos os comentários."},"te":"Finish the series with a live result and an invitation to respond.","se":{"en":"The step-by-step build is in my bio as a mini course.","pt":"O passo a passo da construção está na bio como mini curso."}},{"t":"Before vs after: the same prompt, improved","k":"Split screen","tech":"Before vs after","h":{"en":"Same task. Ten seconds apart. Look at the difference.","pt":"A mesma tarefa. Dez segundos de diferença. Vê a diferença."},"sh":{"en":["0-3s: Two screens side by side: Before, After.","3-9s: Before prompt, weak output. After prompt, strong output.","9-12s: {name} points at the difference in the last line."],"pt":["0-3s: Dois ecrãs lado a lado: Antes, Depois.","3-9s: Prompt antes, resultado fraco. Prompt depois, resultado forte.","9-12s: {name} aponta a diferença na última linha."]},"ot":{"en":["Before","After","One line changed"],"pt":["Antes","Depois","Mudou uma linha"]},"s":{"en":"Same task, two prompts. The first is one line, the second adds who it is for and an example. Look at how different the answers are. One line of context is worth a hundred tries.","pt":"A mesma tarefa, dois prompts. O primeiro é uma linha, o segundo acrescenta para quem é e um exemplo. Vê como as respostas são diferentes. Uma linha de contexto vale cem tentativas."},"te":"Prove a prompt tip with two real outputs.","se":null},{"t":"Free mini course, lesson 1","k":"Talking head, short lesson","tech":"Soft offer after value","h":{"en":"Lesson one. Under a minute. You will make your first app.","pt":"Lição um. Menos de um minuto. Vais criar a tua primeira aplicação."},"sh":{"en":["0-3s: {name} with Lesson 1 card.","3-9s: Screen shows the one prompt, the app appears.","9-12s: {name} points at the next lesson."],"pt":["0-3s: {name} com o cartão Lição 1.","3-9s: O ecrã mostra o prompt, a aplicação aparece.","9-12s: {name} aponta para a lição seguinte."]},"ot":{"en":["Lesson 1","Your first app"],"pt":["Lição 1","A tua primeira aplicação"]},"s":{"en":"Lesson one of my mini course. One prompt, one tiny app, under a minute. Do it with me. The rest of the lessons are in my bio if you want to keep going.","pt":"Lição um do meu mini curso. Um prompt, uma aplicação pequena, menos de um minuto. Faz comigo. As restantes lições estão na bio se quiseres continuar."},"te":"Give a real lesson for free, then point to the rest.","se":{"en":"Full course in bio.","pt":"Curso completo na bio."}},{"t":"Ship it in a weekend: the plan","k":"Talking head with checklist","tech":"Time-boxed challenge","h":{"en":"Forty-eight hours. One idea. Here is the exact plan.","pt":"Quarenta e oito horas. Uma ideia. Aqui está o plano exato."},"sh":{"en":["0-3s: Saturday 9:00 on screen, coffee, laptop.","3-9s: Checklist appears: idea, prompt, build, test, deploy.","9-12s: {name} ticks the first item."],"pt":["0-3s: Sábado 9:00 no ecrã, café, portátil.","3-9s: Lista aparece: ideia, prompt, construir, testar, publicar.","9-12s: {name} marca o primeiro item."]},"ot":{"en":["48 hours","5 steps"],"pt":["48 horas","5 passos"]},"s":{"en":"Forty-eight hours, one idea. Step one, write the idea in one sentence. Step two, ask for a plan. Step three, build the smallest version. Save this checklist and start Saturday.","pt":"Quarenta e oito horas, uma ideia. Passo um, escreve a ideia numa frase. Passo dois, pede um plano. Passo três, constrói a versão mais pequena. Guarda esta lista e começa no sábado."},"te":"A repeatable weekend project process.","se":{"en":"The checklist is a template in my bio.","pt":"A lista é um template na bio."},"g":"w"},{"t":"Code in plain words","k":"Whiteboard explainer","tech":"Plain-words promise","h":{"en":"Reading code without being scared of it. Three lines.","pt":"Ler código sem medo. Três linhas."},"sh":{"en":["0-3s: Three lines of simple code on screen.","3-9s: {name} highlights each with a plain-words label.","9-12s: All three lines now read like a sentence."],"pt":["0-3s: Três linhas de código simples no ecrã.","3-9s: {name} destaca cada uma com uma etiqueta em palavras simples.","9-12s: As três linhas agora lêem-se como uma frase."]},"ot":{"en":["Code = a sentence","Line by line"],"pt":["Código = uma frase","Linha a linha"]},"s":{"en":"Code is just a sentence. This says: take the list, keep only the long words, show them. Read it line by line and it stops being scary. Which line should I explain next?","pt":"O código é só uma frase. Isto diz: pega na lista, fica só com as palavras compridas, mostra-as. Lê linha a linha e deixa de assustar. Que linha explico a seguir?"},"te":"Make code approachable for a beginner.","se":null,"g":"w"},{"t":"Automate one boring thing","k":"Screen recording","tech":"Pain to relief","h":{"en":"I automated the thing I hated doing every Monday.","pt":"Automatizei aquilo que detestava fazer todas as segundas."},"sh":{"en":["0-3s: Calendar with Monday circled, {name} sighs.","3-9s: Workflow runs: input, steps, output appear.","9-12s: Final file, time saved on screen."],"pt":["0-3s: Calendário com a segunda circulada, {name} suspira.","3-9s: O fluxo corre: entrada, passos, saída aparecem.","9-12s: Ficheiro final, tempo poupado no ecrã."]},"ot":{"en":["Monday task","Automated","45 min to 2 min"],"pt":["Tarefa de segunda","Automatizada","45 min para 2 min"]},"s":{"en":"Every Monday I renamed and sorted the same files. Forty-five minutes. I built a tiny workflow, now it runs in two. The point is to automate one boring thing, not everything.","pt":"Todas as segundas mudava o nome e organizava os mesmos ficheiros. Quarenta e cinco minutos. Construí um fluxo pequeno, agora corre em dois. O ponto é automatizar uma coisa aborrecida, não tudo."},"te":"Show a real automation with real time saved.","se":{"en":"The workflow template is in my bio.","pt":"O template do fluxo está na bio."},"g":"m"},{"t":"Test an AI tool live","k":"Screen recording, honest","tech":"Honest verdict","h":{"en":"I tested this AI tool so you do not waste a weekend.","pt":"Testei esta ferramenta de IA para não perderes um fim de semana."},"sh":{"en":["0-3s: Tool name [TOOL] on screen.","3-9s: Run three real tests, show the result of each.","9-12s: Verdict card: good for, not good for."],"pt":["0-3s: Nome da ferramenta [TOOL] no ecrã.","3-9s: Corre três testes reais, mostra o resultado de cada um.","9-12s: Cartão de veredito: bom para, não tão bom para."]},"ot":{"en":["[TOOL]","Verdict: good / not good"],"pt":["[TOOL]","Veredito: bom / não tão bom"]},"s":{"en":"I tested [TOOL] three ways. It is great at the first, okay at the second, and it fails the third. I will show the fail too. Verdict: use it for [USE], skip it for [SKIP].","pt":"Testei a [TOOL] de três maneiras. É ótima na primeira, razoável na segunda, e falha na terceira. Vou mostrar também a falha. Veredito: usa para [USO], salta para [NÃO]."},"te":"Real tests, real fails, honest verdict.","se":null,"g":"m"}],"photos":[{"t":"Profile photo: the face","img":"Close portrait, soft desk light, laptop and plant blurred behind. Relaxed smile. 4:5.","why":"The account face.","cap":{"en":"Hi, I am {name}. AI creator. Build with AI, shown running.","pt":"Olá, sou {a} {name}. Criad{ora} de IA. Construir com IA, a funcionar."}},{"t":"Desk setup","img":"Top-down desk: laptop with code, notebook, headphones, coffee. {name} hand on trackpad. 4:5.","why":"Sets the work context.","cap":{"en":"Today's office. Ship something small.","pt":"O escritório de hoje. Construir algo pequeno."}},{"t":"Whiteboard day","img":"{name} drawing boxes and arrows on a whiteboard, back half-turned, bright room. 4:5.","why":"Explainer energy.","cap":{"en":"Drew the plan before writing a line.","pt":"Desenhei o plano antes de escrever uma linha."}},{"t":"Carousel: prompt before and after","img":"Three slides: weak prompt, strong prompt, the output. Clear mono font. 4:5.","why":"Saved and shared a lot.","cap":{"en":"Swipe: the one-line change. Save it.","pt":"Desliza: a mudança de uma linha. Guarda."}},{"t":"Café and a build","img":"{name} at a café table, laptop open, a phone with the app on it in the foreground. 4:5.","why":"Life and work in {city}.","cap":{"en":"Coffee, then ship.","pt":"Café e depois publicar."}},{"t":"Behind the scenes","img":"Messy desk, sticky notes with a bug list, {name} laughing. 4:5.","why":"Warmth and honesty about bugs.","cap":{"en":"The honest bug list. Day 3.","pt":"A lista honesta de erros. Dia 3."}}],"stories":[{"t":"Meet {name}","fr":["Selfie at the desk with \"Hi, I am {name}\"","Screen of a tiny project","Text: \"AI creator, I build and show\""],"st":"Link sticker","go":"Introduce the face and the AI label."},{"t":"Poll: what should I build next?","fr":["Screen with three ideas","Poll sticker with two options","Result frame"],"st":"Poll","go":"Let the audience pick the next build.","q":{"en":["Which should I build next?"],"pt":["Qual construo a seguir?"]}},{"t":"Today's prompt","fr":["Screenshot of a prompt","Screenshot of the output","Text: \"Try it\""],"st":"Question box: \"Paste your result\"","go":"Share a small, useful prompt."},{"t":"Quiz: what does this code do?","fr":["Three lines of code","Quiz sticker, three choices","Answer frame with plain explanation"],"st":"Quiz","go":"Interaction and learning.","q":{"en":["What does this code do?"],"pt":["O que faz este código?"]}},{"t":"Build log","fr":["Screenshot of today's change","One bug and the fix","Progress bar"],"st":"Emoji slider: \"How is the build?\"","go":"Show progress in the open."},{"t":"Reel reminder","fr":["Thumbnail of the new reel with arrow","One line why to watch","Link sticker"],"st":"Link sticker","go":"Drive views to the newest reel."},{"t":"Q and A","fr":["Answers to three questions","Answer with a short screen recording","Answer with a photo"],"st":"Question box","go":"Build trust by answering."},{"t":"Course teaser","fr":["Course page on screen","Lesson 1 outline","\"Mini course in my bio\""],"st":"Link sticker","go":"Soft offer once trust exists."}]},"design":{"reels":[{"t":"Before and after: one screen redesigned","k":"Before/after with animated transition","tech":"Before vs after","h":{"en":"This screen was ugly on Monday. Watch the swap.","pt":"Este ecrã estava feio na segunda. Vê a troca."},"sh":{"en":["0-3s: The old [SCREEN] full frame, slightly awkward.","3-8s: Animated transition: elements slide and morph into the new layout.","8-12s: The new [SCREEN], {name} points at the biggest change."],"pt":["0-3s: O [SCREEN] antigo em ecrã inteiro, meio estranho.","3-8s: Transição animada: os elementos deslizam e transformam-se no novo layout.","8-12s: O novo [SCREEN], {name} aponta para a maior mudança."]},"ot":{"en":["Before","After","3 changes"],"pt":["Antes","Depois","3 mudanças"]},"s":{"en":"Before, after. Three changes: bigger title, one clear button, more space. Nothing fancy, and it feels like a different app. Save this and try it on your own screen.","pt":"Antes, depois. Três mudanças: título maior, um botão claro, mais espaço. Nada de especial, e parece outra aplicação. Guarda isto e experimenta no teu ecrã."},"te":"A real design before and after, joined by an animated transition.","se":null},{"t":"Figma in 60 seconds: auto layout","k":"Screen recording, fast","tech":"Time-boxed promise","h":{"en":"One Figma trick that ends manual spacing forever.","pt":"Um truque do Figma que acaba com o espaçamento manual para sempre."},"sh":{"en":["0-3s: Messy buttons with uneven padding.","3-9s: Select, press Shift A, padding fixes itself.","9-12s: Resize the text, the button grows with it."],"pt":["0-3s: Botões desarrumados com margens irregulares.","3-9s: Selecionar, Shift A, as margens corrigem-se sozinhas.","9-12s: Muda o tamanho do texto, o botão cresce com ele."]},"ot":{"en":["Shift + A","Auto layout"],"pt":["Shift + A","Auto layout"]},"s":{"en":"Select the layers, press Shift A. That is auto layout. Now the button grows with the text and the padding never drifts. Sixty seconds well spent. Want the next trick?","pt":"Seleciona as camadas, carrega em Shift A. Isso é auto layout. Agora o botão cresce com o texto e as margens não saem do sítio. Sessenta segundos bem gastos. Queres o próximo truque?"},"te":"One technique, one minute, the visible result.","se":null},{"t":"App teardown: what works, what to fix","k":"Critique with annotations","tech":"Honest critique","h":{"en":"We designed this ourselves. Here is what is wrong with it.","pt":"Desenhámos isto nós. Aqui está o que está errado."},"sh":{"en":["0-3s: Screen of our own [APP], red circle on one problem.","3-9s: Three annotations: tap target too small, low contrast, crowded header.","9-12s: Fixed version, green check."],"pt":["0-3s: Ecrã da nossa [APP], círculo vermelho num problema.","3-9s: Três anotações: alvo de toque pequeno, contraste baixo, cabeçalho apertado.","9-12s: Versão corrigida, visto verde."]},"ot":{"en":["Teardown","3 fixes"],"pt":["Análise","3 correções"]},"s":{"en":"Critiquing our own work. The tap target is too small, the contrast is weak, the header is crowded. Three fixes, all small. Great design is mostly boring fixes.","pt":"A criticar o nosso trabalho. O alvo de toque é pequeno, o contraste é fraco, o cabeçalho está apertado. Três correções, todas pequenas. O bom design é sobretudo correções aborrecidas."},"te":"A team design critique with fixes. Never critique a real third-party product unfairly.","se":null},{"t":"Coded app showcase","k":"Phone screen recording","tech":"Result first","h":{"en":"A coded app that feels expensive. Watch the first tap.","pt":"Uma aplicação programada que parece cara. Vê o primeiro toque."},"sh":{"en":["0-3s: Phone in hand, app opens with a smooth animation.","3-9s: Tap through three screens, soft transitions.","9-12s: Back to the design file behind it."],"pt":["0-3s: Telemóvel na mão, a aplicação abre com uma animação suave.","3-9s: Toca por três ecrãs, transições suaves.","9-12s: Volta ao ficheiro de design por trás."]},"ot":{"en":["Coded app","Designed first"],"pt":["Aplicação programada","Desenhada primeiro"]},"s":{"en":"This is a real coded app, running on my phone. What makes it feel good is not the code. It is spacing, soft motion and one clear colour. Design first, code second.","pt":"Isto é uma aplicação real, a correr no meu telemóvel. O que a faz parecer boa não é o código. É o espaçamento, o movimento suave e uma cor clara. Design primeiro, código depois."},"te":"A coded app, then the design choices that made it feel good.","se":{"en":"The UI kit behind it is in my bio.","pt":"O UI kit por trás está na bio."}},{"t":"The 8-point spacing rule","k":"Whiteboard plus screen","tech":"Rule of three","h":{"en":"If your design feels off, check your spacing.","pt":"Se o teu design parece estranho, vê o espaçamento."},"sh":{"en":["0-3s: Two cards, one with random gaps, one even.","3-9s: Grid overlay, gaps snap to 8, 16, 24.","9-12s: Both cards side by side, the even one looks calm."],"pt":["0-3s: Dois cartões, um com espaços aleatórios, outro regular.","3-9s: Grelha por cima, os espaços ajustam-se a 8, 16, 24.","9-12s: Os dois cartões lado a lado, o regular parece calmo."]},"ot":{"en":["8, 16, 24","Use multiples of 8"],"pt":["8, 16, 24","Usa múltiplos de 8"]},"s":{"en":"Use multiples of eight. Eight, sixteen, twenty-four. Random gaps make a design feel off, even when you cannot say why. One rule, instant calm.","pt":"Usa múltiplos de oito. Oito, dezasseis, vinte e quatro. Espaços aleatórios fazem o design parecer estranho, mesmo quando não sabes porquê. Uma regra, calma imediata."},"te":"A single rule that visibly improves a layout.","se":null},{"t":"Low contrast: the quiet mistake","k":"Mistake reveal","tech":"Mistake reveal","h":{"en":"Nobody can read your grey text. Not even you.","pt":"Ninguém consegue ler o teu texto cinzento. Nem tu."},"sh":{"en":["0-3s: Light grey text on white, {name} squints.","3-9s: Contrast checker shows 2.1, then fix to 4.6.","9-12s: Readable version."],"pt":["0-3s: Texto cinzento claro em branco, {name} semicerra os olhos.","3-9s: O verificador mostra 2,1, depois corrige para 4,6.","9-12s: Versão legível."]},"ot":{"en":["Contrast 2.1","Contrast 4.6"],"pt":["Contraste 2,1","Contraste 4,6"]},"s":{"en":"Light grey on white looks elegant and nobody can read it. Aim for at least four point five contrast for body text. Check it takes two seconds. Your users will not tell you, they will just leave.","pt":"Cinzento claro em branco parece elegante e ninguém consegue ler. Procura pelo menos quatro vírgula cinco de contraste para texto. Verificar demora dois segundos. Os teus utilizadores não te dizem, simplesmente vão-se embora."},"te":"Accessibility as a quick visible win.","se":null},{"t":"Onboarding screen before and after","k":"Before/after","tech":"Before vs after","h":{"en":"Seven fields on one screen. We cut it to one.","pt":"Sete campos num só ecrã. Reduzimos para um."},"sh":{"en":["0-3s: Crowded signup form with seven fields.","3-9s: Wipe transition: one field, big button, friendly line.","9-12s: Completion rate card (only if it is real)."],"pt":["0-3s: Formulário de registo apertado com sete campos.","3-9s: Transição: um campo, botão grande, frase simpática.","9-12s: Cartão da taxa de conclusão (só se for real)."]},"ot":{"en":["7 fields to 1","Before / After"],"pt":["7 campos para 1","Antes / Depois"]},"s":{"en":"Seven fields on one screen is a wall. We asked for the email first, and the rest later. One field, one button, one friendly line. Ask only what you need right now.","pt":"Sete campos num só ecrã é uma parede. Pedimos primeiro o email, o resto depois. Um campo, um botão, uma frase simpática. Pede só o que precisas agora."},"te":"A before and after that teaches progressive disclosure. Use a real result or none.","se":null},{"t":"A palette from one colour","k":"Screen recording, Figma","tech":"Visual surprise","h":{"en":"One colour in, a whole palette out. Ten seconds.","pt":"Uma cor entra, uma paleta inteira sai. Dez segundos."},"sh":{"en":["0-3s: One purple swatch.","3-9s: Shades appear: darker, lighter, a neutral and an accent.","9-12s: Applied to an app screen, light then dark mode."],"pt":["0-3s: Uma amostra roxa.","3-9s: Aparecem tons: mais escuro, mais claro, um neutro e um destaque.","9-12s: Aplicada a um ecrã, modo claro e escuro."]},"ot":{"en":["1 colour to 6","Light and dark"],"pt":["1 cor para 6","Claro e escuro"]},"s":{"en":"Start with one colour. Make a darker one for the background, a mid one for buttons, a light one for text, and a grey for lines. Same palette works in light and dark. Try it with your brand colour.","pt":"Começa com uma cor. Faz uma mais escura para o fundo, uma média para botões, uma clara para o texto e um cinzento para linhas. A mesma paleta funciona em claro e escuro. Experimenta com a cor da tua marca."},"te":"Teach how to build a palette and apply it in two themes.","se":{"en":"My palettes are in the kit in my bio.","pt":"As minhas paletas estão no kit na bio."}},{"t":"A micro-interaction that sells the app","k":"Phone recording, slow-motion","tech":"Visual surprise","h":{"en":"Watch this button. Slow it down.","pt":"Olha para este botão. Em câmara lenta."},"sh":{"en":["0-3s: Button at rest.","3-8s: Slow-motion tap: scale down, soft haptic cue, scale back up.","8-12s: The same button at normal speed."],"pt":["0-3s: Botão parado.","3-8s: Toque em câmara lenta: encolhe, vibração suave, volta ao tamanho.","8-12s: O mesmo botão à velocidade normal."]},"ot":{"en":["Press: 96%","120 ms"],"pt":["Pressão: 96%","120 ms"]},"s":{"en":"This is the whole trick: the button shrinks to ninety-six percent for a tiny moment and bounces back. You feel it without noticing. Small motion, big quality.","pt":"Este é o truque todo: o botão encolhe para noventa e seis por cento por um instante e volta. Sentes sem dares conta. Movimento pequeno, grande qualidade."},"te":"A small, copyable motion detail.","se":null},{"t":"Free UI kit lesson 1","k":"Talking head with screen","tech":"Soft offer after value","h":{"en":"Lesson one of a free mini lesson series: your first design system.","pt":"Lição um de uma série grátis: o teu primeiro sistema de design."},"sh":{"en":["0-3s: {name} with \"Lesson 1\" card.","3-9s: Screen: colour, type, spacing become three styles.","9-12s: {name} points to the next lesson."],"pt":["0-3s: {name} com cartão \"Lição 1\".","3-9s: Ecrã: cor, tipografia, espaçamento tornam-se três estilos.","9-12s: {name} aponta para a lição seguinte."]},"ot":{"en":["Lesson 1","Colour, type, space"],"pt":["Lição 1","Cor, tipo, espaço"]},"s":{"en":"Lesson one. A design system is just three decisions: colour, type, spacing. Make them once, reuse them everywhere. The next lessons and the kit are in my bio if you want them.","pt":"Lição um. Um sistema de design são só três decisões: cor, tipo, espaçamento. Tomas uma vez, reutilizas em todo o lado. As próximas lições e o kit estão na bio se quiseres."},"te":"Give a real lesson, then point to the kit.","se":{"en":"UI kit in bio.","pt":"UI kit na bio."}},{"t":"Figma speed-run: five shortcuts","k":"Screen recording, fast","tech":"Time-boxed promise","h":{"en":"Five Figma shortcuts in twenty seconds. Beat the clock.","pt":"Cinco atalhos do Figma em vinte segundos. Vence o relógio."},"sh":{"en":["0-3s: Timer 0:20 on screen.","3-10s: Each shortcut flashes with its result.","10-12s: Timer stops, {name} grins."],"pt":["0-3s: Cronómetro 0:20 no ecrã.","3-10s: Cada atalho aparece com o resultado.","10-12s: O cronómetro para, {name} sorri."]},"ot":{"en":["5 shortcuts","20 seconds"],"pt":["5 atalhos","20 segundos"]},"s":{"en":"Five shortcuts, twenty seconds. Auto layout, duplicate, rename, align, component. Say the one you did not know in the comments. I will do the next five.","pt":"Cinco atalhos, vinte segundos. Auto layout, duplicar, mudar nome, alinhar, componente. Diz nos comentários o que não conhecias. Faço os próximos cinco."},"te":"A fast list that is easy to save and share.","se":null,"g":"w"},{"t":"Design critique of our own dashboard","k":"Critique with annotations","tech":"Honest critique","h":{"en":"This dashboard has too many numbers. Which one matters?","pt":"Este painel tem demasiados números. Qual importa?"},"sh":{"en":["0-3s: Dashboard with twelve numbers.","3-9s: Cards fade out until one hero number remains.","9-12s: {name} nods at the calmer screen."],"pt":["0-3s: Painel com doze números.","3-9s: Os cartões desaparecem até sobrar um número principal.","9-12s: {name} acena perante o ecrã mais calmo."]},"ot":{"en":["12 numbers to 1","Hero metric"],"pt":["12 números para 1","Métrica principal"]},"s":{"en":"Twelve numbers on one screen and nobody knows what to look at. Pick the one that matters, make it big, put the rest underneath. Hierarchy is the whole job.","pt":"Doze números num ecrã e ninguém sabe onde olhar. Escolhe o que importa, faz-o grande, põe o resto por baixo. A hierarquia é o trabalho todo."},"te":"Teach visual hierarchy from a team-made screen.","se":null,"g":"w"},{"t":"Design tokens in one minute","k":"Screen recording","tech":"Nerdy payoff","h":{"en":"Change one value, and the whole app updates.","pt":"Muda um valor, e a aplicação inteira atualiza."},"sh":{"en":["0-3s: App screens in a grid, all purple.","3-9s: Edit one colour token, every screen shifts.","9-12s: Switch to dark mode, it follows."],"pt":["0-3s: Ecrãs numa grelha, todos roxos.","3-9s: Edita um token de cor, todos os ecrãs mudam.","9-12s: Muda para modo escuro, acompanha."]},"ot":{"en":["Design token","1 value, all screens"],"pt":["Token de design","1 valor, todos os ecrãs"]},"s":{"en":"A design token is a named value. Change it once, the whole app follows, even in dark mode. Name colours by what they do, not what they look like. That is a design system.","pt":"Um token de design é um valor com nome. Mudas uma vez, a aplicação inteira acompanha, até no modo escuro. Dá nomes às cores pelo que fazem, não pelo que parecem. Isso é um sistema de design."},"te":"Explain tokens and light/dark consistency.","se":{"en":"Token starter set in the kit in my bio.","pt":"Conjunto inicial de tokens no kit na bio."},"g":"m"},{"t":"Easing curves: why motion feels cheap","k":"Slow-motion comparison","tech":"Visual surprise","h":{"en":"These two animations are the same length. One feels cheap.","pt":"Estas duas animações têm a mesma duração. Uma parece barata."},"sh":{"en":["0-3s: Two boxes moving across the screen.","3-9s: Left is linear, right uses ease-out. Slow it down.","9-12s: Curve graph under each."],"pt":["0-3s: Duas caixas a mover-se pelo ecrã.","3-9s: A esquerda é linear, a direita usa ease-out. Em câmara lenta.","9-12s: Gráfico da curva debaixo de cada uma."]},"ot":{"en":["Linear vs ease-out"],"pt":["Linear vs ease-out"]},"s":{"en":"Same distance, same time. The left one is linear and feels like a robot. The right one starts fast and settles gently. Use ease-out for things entering the screen.","pt":"A mesma distância, o mesmo tempo. A da esquerda é linear e parece um robô. A da direita começa rápida e assenta com calma. Usa ease-out para o que entra no ecrã."},"te":"A visible motion principle in one comparison.","se":null,"g":"m"}],"photos":[{"t":"Profile photo: the face","img":"Close portrait, soft studio light, colourful design mood board blurred behind. Easy sm
